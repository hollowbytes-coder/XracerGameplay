<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RACER X</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#090d12;color:#fff;font-family:system-ui,Arial;touch-action:none}
html{width:100vw;height:100dvh}
body{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100dvh}
#game{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100dvh;overflow:hidden;background:#9db8c5}
#game canvas{position:absolute;inset:0;display:block;width:100%!important;height:100%!important}
@supports not (height:100dvh){body,#game{height:100vh;min-height:100vh}}
@media (orientation:landscape){#game,#hud{width:100vw;height:100dvh}}
/* ===== PREMIUM 3D LOADING SCREEN ===== */
#loading{position:absolute;inset:0;z-index:30;overflow:hidden;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#loadBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
#loadCanvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;z-index:1;opacity:1;transition:opacity .6s ease;background:transparent}
#loadUI{position:relative;z-index:2;width:100%;padding:0 24px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center}
#loadtxt,#loadTitle,#loadSubtitle,#loadPercent,#loadHint{display:none!important}
#bar{width:min(78vw,520px);height:12px;background:#1a0a0acc;border-radius:20px;overflow:hidden;border:1px solid #ffffff30;box-shadow:0 4px 20px #0008,inset 0 1px 0 #ffffff18;margin-bottom:4px}
#progress{height:100%;width:0;background:linear-gradient(90deg,#b01010,#e02020 40%,#ff4040);border-radius:20px;box-shadow:0 0 16px #e0202088;transition:width .25s ease-out}
@media (orientation:portrait){#bar{width:min(86vw,420px)}}
@media (max-height:430px){#loadUI{padding-bottom:12px}#bar{height:9px}}

/* ===== MENU SCREEN 1 (after loading) ===== */
#menuScreen{position:absolute;inset:0;z-index:25;display:none;overflow:hidden;background:#000;flex-direction:column;align-items:center;justify-content:flex-end}
#menuScreen.show{display:flex}
#menuBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
#menuCars{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#menuUI{position:relative;z-index:3;width:100%;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
#playBtn{pointer-events:auto;border:0;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  min-width:min(70vw,280px);padding:16px 36px;border-radius:16px;font-size:clamp(18px,4.5vw,26px);font-weight:900;letter-spacing:.18em;
  color:#fff;background:linear-gradient(180deg,#e02828 0%,#b01010 55%,#8a0a0a 100%);
  box-shadow:0 6px 0 #5a0606,0 10px 28px #000a,inset 0 1px 0 #ff606088;
  text-shadow:0 2px 4px #0008;transform:translateY(0);transition:transform .08s,box-shadow .08s,filter .12s}
#playBtn:active,#playBtn.pressed{transform:translateY(5px);box-shadow:0 1px 0 #5a0606,0 4px 14px #0008;filter:brightness(.95)}
#playBtn:hover{filter:brightness(1.08)}
#menuTitle{font-size:clamp(22px,5.5vw,40px);font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 3px 18px #000c,0 0 30px #e0282866;margin:0;text-transform:uppercase}
#menuSub{font-size:clamp(10px,2vw,13px);color:#ffd0d0cc;letter-spacing:.28em;margin:0 0 4px;font-weight:700}
@media (max-height:430px){#playBtn{padding:12px 28px;font-size:16px}#menuUI{padding-bottom:16px}}

#hud{position:absolute;inset:0;pointer-events:none}
.pill{background:#07121dcc;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;backdrop-filter:blur(5px);font-weight:700}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start}
#speed{font-size:25px;min-width:96px;text-align:center}
#speed small{font-size:10px;color:#9fb3c1;display:block;letter-spacing:1px}
#message{display:none!important;position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:#dbe8ef}
#controls{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,8px);height:150px;display:flex;justify-content:space-between;align-items:end;padding:10px 14px;pointer-events:none}
/* ===== TEXTURE TOUCH CONTROLS ===== */
:root{--tex-left:none;--tex-right:none;--tex-gas:none;--tex-brake:none}
.ctrl{position:relative;display:block;padding:0;margin:0;border:0;background:transparent;color:#fff;font-weight:800;
 -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:none;
 outline:none;cursor:pointer;will-change:transform;
 transform:translate3d(0,calc(var(--p,0)*5px),0) scale(calc(1 - var(--p,0)*.12));
 filter:brightness(calc(1 + var(--p,0)*.18)) saturate(calc(1 + var(--p,0)*.25)) drop-shadow(0 calc(6px - var(--p,0)*4px) calc(10px - var(--p,0)*5px) #000a);
 transition:filter .12s linear}
.ctrl .face{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:contain;pointer-events:none;border-radius:inherit}
/* fallback look (kapag wala pa ang PNG) */
.ctrl.nofile{display:grid;place-items:center;border:1px solid #ffffff55;background:#102332cc;border-radius:50%;box-shadow:0 4px 18px #0008}
.ctrl.hastex .face{background-image:var(--img)}
#left,#right{width:78px;height:78px}
#left{--img:var(--tex-left);}
#right{--img:var(--tex-right);}
#gas{height:104px;width:88px;border-radius:18px;--img:var(--tex-gas);font-size:15px}
#brake{height:84px;width:84px;border-radius:18px;--img:var(--tex-brake);font-size:12px}
#gas.nofile{background:#087d57dd}
#brake.nofile{background:#9b2635dd}
#steer{display:flex;gap:12px;align-items:end;pointer-events:auto}
#pedals{display:flex;gap:14px;align-items:end;pointer-events:auto}
@media (max-height:430px){#left,#right{width:68px;height:68px}#gas{height:92px;width:78px}#brake{height:74px;width:74px}}
#actions{position:absolute;right:10px;top:58px;display:flex;gap:7px;pointer-events:auto}
.smallbtn{border:1px solid #ffffff44;background:#0b1b28dd;color:white;border-radius:9px;padding:8px 10px;font-size:12px}
#hint{display:none!important;position:absolute;left:50%;bottom:165px;transform:translateX(-50%);font-size:11px;color:#dce6eddd;white-space:nowrap;text-shadow:0 2px 4px #000}
@media (orientation:portrait){#hint:after{content:" • Mas maganda sa landscape";color:#ffd36a}}

/* ===== ON-FOOT PLAYER CONTROLS ===== */
#playerControls{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,8px);height:180px;pointer-events:none;display:none;z-index:8}
#joystick{position:absolute;left:18px;bottom:18px;width:128px;height:128px;border-radius:50%;background:#07121dcc;border:2px solid #ffffff44;box-shadow:0 5px 20px #0009;pointer-events:auto;touch-action:none}
#joystickBase{position:absolute;inset:18px;border-radius:50%;border:1px solid #ffffff28;background:#ffffff0b}
#joystickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#dbeaf2cc;border:2px solid #ffffff88;box-shadow:0 3px 12px #0008;transform:translate3d(0,0,0);pointer-events:none}
#playerButtons{position:absolute;right:18px;bottom:16px;display:flex;align-items:end;gap:12px;pointer-events:auto}
.playerBtn{width:72px;height:72px;border:1px solid #ffffff55;border-radius:50%;background:#102332dd;color:#fff;font-weight:900;box-shadow:0 4px 18px #0008;touch-action:none}
#jumpBtn{width:78px;height:78px;background:#2466a8dd}
#runBtn{background:#9b6a1add}
#enterBtn{position:absolute;left:50%;bottom:184px;transform:translateX(-50%);display:none;pointer-events:auto;border:1px solid #ffffff66;border-radius:12px;background:#0b1b28ee;color:#fff;padding:11px 18px;font-weight:900;box-shadow:0 4px 18px #0008}
#modeBadge{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:none;pointer-events:none;background:#07121dcc;border:1px solid #ffffff30;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:900}
#controls.vehicleOnly{display:flex}
@media (max-height:430px){#joystick{width:104px;height:104px;bottom:10px;left:12px}#joystickKnob{width:46px;height:46px;margin:-23px 0 0 -23px}.playerBtn{width:62px;height:62px}#jumpBtn{width:68px;height:68px}#enterBtn{bottom:154px}}
/* ===== PAUSE BUTTON (top center) + PAUSE SCREEN (blurred) ===== */
#pauseBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:5px;
 width:46px;height:40px;padding:0;border:1px solid #ffffff44;border-radius:12px;background:#07121dcc;box-shadow:0 4px 14px #0008;
 pointer-events:auto;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;backdrop-filter:blur(5px);transition:transform .08s,filter .12s}
#pauseBtn.show{display:flex}
#pauseBtn span{display:block;width:5px;height:18px;border-radius:2px;background:#fff}
#pauseBtn:active{transform:translateX(-50%) translateY(2px) scale(.94);filter:brightness(1.2)}
#pauseScreen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
 background:rgba(4,9,15,.38);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);
 opacity:0;visibility:hidden;pointer-events:none;
 transition:opacity .28s ease,visibility 0s linear .28s,backdrop-filter .28s ease,-webkit-backdrop-filter .28s ease;
 touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pauseScreen.show{opacity:1;visibility:visible;pointer-events:auto;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
 transition:opacity .28s ease,visibility 0s,backdrop-filter .28s ease,-webkit-backdrop-filter .28s ease}
#pauseTitle{opacity:0;transform:translateY(18px) scale(.94);transition:opacity .3s ease,transform .4s cubic-bezier(.2,1.3,.4,1);margin:0 0 6px;font-size:clamp(24px,6vw,42px);font-weight:900;letter-spacing:.2em;color:#fff;text-shadow:0 3px 18px #000c;text-transform:uppercase}
.pauseOpt{position:relative;overflow:hidden;pointer-events:auto;border:0;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
 min-width:min(62vw,250px);padding:14px 30px;border-radius:14px;font-size:clamp(16px,4vw,22px);font-weight:900;letter-spacing:.16em;color:#fff;
 text-shadow:0 2px 4px #0008;opacity:0;transform:translateY(18px) scale(.94);will-change:transform;
 transition:opacity .3s ease,transform .42s cubic-bezier(.2,1.3,.4,1),box-shadow .14s,filter .14s}
.pauseOpt:hover{filter:brightness(1.08)}
#pauseScreen.show #pauseTitle,#pauseScreen.show .pauseOpt{opacity:1;transform:none}
#pauseScreen.show #resumeBtn{transition-delay:.06s,.06s,0s,0s}
#pauseScreen.show #exitBtn{transition-delay:.12s,.12s,0s,0s}
#pauseScreen .pauseOpt.pressed{transform:translateY(5px) scale(.95);filter:brightness(1.18);transition:transform .08s ease-out,box-shadow .08s,filter .1s;transition-delay:0s}
#pauseScreen .pauseOpt.chosen{transform:scale(1.07);filter:brightness(1.3);transition:transform .17s cubic-bezier(.2,1.4,.4,1),filter .17s;transition-delay:0s}
.pauseOpt .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);opacity:.9;pointer-events:none;animation:pauseRipple .55s ease-out forwards}
@keyframes pauseRipple{to{transform:scale(1);opacity:0}}
#resumeBtn{background:linear-gradient(180deg,#27c46a 0%,#12994e 55%,#0b7339 100%);box-shadow:0 5px 0 #064a24,0 10px 24px #000a,inset 0 1px 0 #7dffb088}
#resumeBtn:active{box-shadow:0 1px 0 #064a24,0 4px 12px #0008}
#exitBtn{background:linear-gradient(180deg,#e02828 0%,#b01010 55%,#8a0a0a 100%);box-shadow:0 5px 0 #5a0606,0 10px 24px #000a,inset 0 1px 0 #ff606088}
#exitBtn:active{box-shadow:0 1px 0 #5a0606,0 4px 12px #0008}
@media (max-height:430px){#pauseScreen{gap:10px}.pauseOpt{padding:10px 26px}#pauseTitle{margin-bottom:0}}

/* ===== GARAGES BUTTON (pause menu) + SCREEN 3 (GARAGE) ===== */
#pauseScreen.show #garageBtn{transition-delay:.18s,.18s,0s,0s}
#garageBtn{background:linear-gradient(180deg,#2f8cff 0%,#1a63cf 55%,#1246a0 100%);box-shadow:0 5px 0 #0a2a66,0 10px 24px #000a,inset 0 1px 0 #8cc4ff88}
#garageBtn:active{box-shadow:0 1px 0 #0a2a66,0 4px 12px #0008}
#garageScreen{position:absolute;inset:0;z-index:32;display:none;overflow:hidden;
 background:radial-gradient(ellipse at 50% 38%,#26303c 0%,#10151c 55%,#05070a 100%);
 touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#garageScreen.show{display:block;animation:garageIn .35s ease both}
@keyframes garageIn{from{opacity:0}to{opacity:1}}
#garageBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
#garageCanvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;z-index:1}
#garageUI{position:absolute;inset:0;z-index:3;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#garageTitle{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:.28em;color:#fff;text-shadow:0 3px 18px #000c}
.garageArrow{position:absolute;top:50%;transform:translateY(-50%);width:clamp(52px,13vw,76px);height:clamp(52px,13vw,76px);border-radius:50%;border:1px solid #ffffff55;
 background:#0b1b28cc;color:#fff;font-size:clamp(34px,9vw,50px);line-height:1;font-weight:900;padding:0 0 6px;pointer-events:auto;cursor:pointer;outline:none;
 -webkit-tap-highlight-color:transparent;touch-action:manipulation;backdrop-filter:blur(4px);box-shadow:0 4px 18px #0009;transition:transform .1s,filter .12s}
.garageArrow:active{transform:translateY(-50%) scale(.92);filter:brightness(1.3)}
#garagePrev{left:max(14px,env(safe-area-inset-left,0px))}
#garageNext{right:max(14px,env(safe-area-inset-right,0px))}
#garageInfo{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);text-align:center;pointer-events:none;padding:0 16px}
#garageName{font-size:clamp(18px,4.6vw,30px);font-weight:900;letter-spacing:.16em;color:#fff;text-shadow:0 3px 14px #000d}
#garageSub{margin-top:3px;font-size:clamp(11px,2.8vw,14px);color:#cfe0ee;letter-spacing:.06em;text-shadow:0 2px 8px #000}
#garageChips{margin-top:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:auto}
.gChip{border:1px solid #ffffff44;background:#0b1b28cc;color:#cfe0ee;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:.08em;cursor:pointer;outline:none;
 -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gChip.active{background:#1f6fe0;border-color:#9cc8ff;color:#fff}
.gChip.equipped:after{content:" \2713";color:#6dffa8}
#garageBottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;gap:14px;pointer-events:none}
.gBtn{pointer-events:auto;border:0;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-width:min(38vw,190px);padding:12px 22px;border-radius:14px;
 font-size:clamp(14px,3.6vw,19px);font-weight:900;letter-spacing:.14em;color:#fff;text-shadow:0 2px 4px #0008;transition:transform .08s,filter .12s,box-shadow .12s}
.gBtn:active{transform:translateY(4px) scale(.96);filter:brightness(1.2)}
#garageBack{background:linear-gradient(180deg,#e02828 0%,#b01010 55%,#8a0a0a 100%);box-shadow:0 5px 0 #5a0606,0 10px 24px #000a,inset 0 1px 0 #ff606088}
#garageSelect{background:linear-gradient(180deg,#27c46a 0%,#12994e 55%,#0b7339 100%);box-shadow:0 5px 0 #064a24,0 10px 24px #000a,inset 0 1px 0 #7dffb088}
#garageSelect.off{background:linear-gradient(180deg,#59636d 0%,#3b444d 55%,#2a3138 100%);box-shadow:0 5px 0 #151a1f,0 10px 24px #000a;pointer-events:none}
#garageCredit{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font-size:9px;color:#ffffff66;pointer-events:none;max-width:60vw;text-align:right}
#garageToast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%) translateY(-8px);opacity:0;background:#07121dee;border:1px solid #ffffff44;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:800;letter-spacing:.06em;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#garageToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-height:430px){#garageInfo{bottom:calc(env(safe-area-inset-bottom,0px) + 62px)}.gBtn{padding:9px 20px}#garageTitle{font-size:20px;top:calc(env(safe-area-inset-top,0px) + 6px)}#garageChips{margin-top:6px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">
 <img id="loadBg" src="./backgroundloading.jpg" alt="" draggable="false">
 <canvas id="loadCanvas"></canvas>
 <div id="loadUI">
  <div id="bar"><div id="progress"></div></div>
  <div id="loadtxt" style="display:none"></div>
 </div>
</div>
<div id="menuScreen">
 <img id="menuBg" src="./screen1.jpg" alt="" draggable="false">
 <canvas id="menuCars"></canvas>
 <div id="menuUI">
  <div id="menuTitle</div>
  <div id="menuSub">MADE BY BEN HERMOSILLA</div>
  <button id="playBtn" type="button" aria-label="Play">PLAY</button>
 </div>
</div>
<div id="pauseScreen" aria-hidden="true">
 <div id="pauseTitle">PAUSED</div>
 <button id="resumeBtn" class="pauseOpt" type="button">RESUME</button>
 <button id="exitBtn" class="pauseOpt" type="button">EXIT</button>
 <button id="garageBtn" class="pauseOpt" type="button">GARAGES</button>
</div>
<div id="garageScreen" aria-hidden="true">
 <img id="garageBg" src="./screen3.jpg" alt="" draggable="false" onerror="this.style.display='none'">
 <canvas id="garageCanvas"></canvas>
 <div id="garageUI">
  <div id="garageTitle">GARAGES</div>
  <button id="garagePrev" class="garageArrow" type="button" aria-label="Previous car">&#8249;</button>
  <button id="garageNext" class="garageArrow" type="button" aria-label="Next car">&#8250;</button>
  <div id="garageInfo">
   <div id="garageName">GREEN BUGGY</div>
   <div id="garageSub"></div>
   <div id="garageChips"></div>
  </div>
  <div id="garageBottom">
   <button id="garageBack" class="gBtn" type="button">BACK</button>
   <button id="garageSelect" class="gBtn" type="button">SELECT</button>
  </div>
  <div id="garageToast"></div>
  <div id="garageCredit"></div>
 </div>
</div>
<div id="hud">
 <div id="top"><div></div><div id="speed" class="pill">0<small>KM/H</small></div></div>
 <button id="pauseBtn" type="button" aria-label="Pause"><span></span><span></span></button>
 <div id="message" class="pill">WASD / Arrow keys • Touch controls • Sky + Long Shadows ON</div>
 <div id="actions"><button class="smallbtn" id="rain">RAIN</button><button class="smallbtn" id="reset">RESET</button><button class="smallbtn" id="full">FULLSCREEN</button></div>
 <div id="hint">◀ ▶ steer • GAS andar • BRAKE preno • multi-touch OK</div>
 <div id="controls">
  <div id="steer">
   <button class="ctrl nofile" id="left" aria-label="Kaliwa"><span class="face"></span></button>
   <button class="ctrl nofile" id="right" aria-label="Kanan"><span class="face"></span></button>
  </div>
  <div id="pedals">
   <button class="ctrl nofile" id="brake" aria-label="Brake"><span class="face"></span></button>
   <button class="ctrl nofile" id="gas" aria-label="Gas"><span class="face"></span></button>
  </div>

 <div id="modeBadge">DRIVING</div>
 <button id="enterBtn">ENTER CAR</button>
 <div id="playerControls">
  <div id="joystick" aria-label="Movement joystick"><div id="joystickBase"></div><div id="joystickKnob"></div></div>
  <div id="playerButtons"><button class="playerBtn" id="runBtn">RUN</button><button class="playerBtn" id="jumpBtn">JUMP</button></div>
 </div>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

const CONFIG={
 MAP_SCALE:100,
 CAR_LENGTH:4.6,

// --- Far distance blur pass (uses scene depth) ---
class FarBlurPass extends Pass{
 constructor(cam){
  super();
  this.camera=cam;
  this.fsQuad=new FullScreenQuad(new THREE.ShaderMaterial({
   uniforms:{
    tDiffuse:{value:null},tDepth:{value:null},uRes:{value:new THREE.Vector2(1,1)},
    uNear:{value:cam.near},uFar:{value:cam.far},
    uStart:{value:CONFIG.DOF_START},uEnd:{value:CONFIG.DOF_END},uMax:{value:CONFIG.DOF_MAX_BLUR}
   },
   vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
   fragmentShader:`
    uniform sampler2D tDiffuse,tDepth;uniform vec2 uRes;
    uniform float uNear,uFar,uStart,uEnd,uMax;varying vec2 vUv;
    float lin(float d){float z=d*2.0-1.0;return 2.0*uNear*uFar/(uFar+uNear-z*(uFar-uNear));}
    float cocAt(vec2 uv){
     float d=texture2D(tDepth,uv).x;
     if(d>=0.999999)return 0.0;
     return smoothstep(uStart,uEnd,lin(d));
    }
    void main(){
     vec4 base=texture2D(tDiffuse,vUv);
     float c0=cocAt(vUv);
     if(c0<0.02){gl_FragColor=base;return;}
     float R=c0*uMax;
     float rnd=fract(52.9829189*fract(dot(gl_FragCoord.xy,vec2(0.06711056,0.00583715))))*6.2831;
     vec3 sum=base.rgb;float wsum=1.0;
     for(int i=0;i<14;i++){
      float fi=float(i)+0.5;
      float r=sqrt(fi/14.0),a=fi*2.39996+rnd;
      vec2 uv=vUv+vec2(cos(a),sin(a))*r*R/uRes;
      float cs=cocAt(uv);
      float w=0.15+0.85*min(1.0,cs/max(c0,0.001));
      sum+=texture2D(tDiffuse,uv).rgb*w;wsum+=w;
     }
     gl_FragColor=vec4(sum/wsum,base.a);
    }`
  }));
 }
 setSize(w,h){this.fsQuad.material.uniforms.uRes.value.set(w,h);}
 render(renderer,writeBuffer,readBuffer){
  const u=this.fsQuad.material.uniforms;
  u.tDiffuse.value=readBuffer.texture;
  u.tDepth.value=readBuffer.depthTexture;
  u.uNear.value=this.camera.near;u.uFar.value=this.camera.far;
  if(this.renderToScreen){renderer.setRenderTarget(null);}
  else{renderer.setRenderTarget(writeBuffer);if(this.clear)renderer.clear();}
  this.fsQuad.render(renderer);
 }
 dispose(){this.fsQuad.material.dispose();this.fsQuad.dispose();}
}

// --- Post-processing ---
let composer=null;
let bloomPass=null;
function setupPostProcessing(){
 const w=Math.max(1,host.clientWidth||innerWidth);
 const h=Math.max(1,host.clientHeight||innerHeight);
 const pr=renderer.getPixelRatio();
 const sceneRT=new THREE.WebGLRenderTarget(Math.floor(w*pr),Math.floor(h*pr),{type:THREE.HalfFloatType});
 sceneRT.depthTexture=new THREE.DepthTexture(Math.floor(w*pr),Math.floor(h*pr));
 composer=new EffectComposer(renderer,sceneRT);
 // Each buffer needs its OWN depth texture. A cloned one shares the same GPU texture,
 // which caused: "Source and destination textures of the draw are the same" -> black screen
 [composer.renderTarget1,composer.renderTarget2].forEach(rt=>{
  if(rt.depthTexture)rt.depthTexture.dispose();
  rt.depthTexture=new THREE.DepthTexture(Math.floor(w*pr),Math.floor(h*pr));
 });
 const renderPass=new RenderPass(scene,camera);
 // Important: clear color must match sky so no black flash
 renderPass.clearColor=new THREE.Color(0x6a9ab8);
 renderPass.clearAlpha=1;
 composer.addPass(renderPass);
 composer.addPass(new FarBlurPass(camera));

 bloomPass=new UnrealBloomPass(
  new THREE.Vector2(w,h),
  CONFIG.BLOOM_STRENGTH,
  CONFIG.BLOOM_RADIUS,
  CONFIG.BLOOM_THRESHOLD
 );
 composer.addPass(bloomPass);

 const outputPass=new OutputPass();
 composer.addPass(outputPass);
}

 rim.position.set(-2,2,5);
 scene.add(rim);
 scene.add(new THREE.AmbientLight(0x607090,0.6));
 scene.add(new THREE.HemisphereLight(0xffe8d0,0x203050,0.65));

 loadState.scene=scene;
 loadState.camera=camera;
 loadState.renderer=renderer;

 function sizeLoad(){
  const w=Math.max(1,canvas.clientWidth||innerWidth);
  const h=Math.max(1,canvas.clientHeight||innerHeight);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
 }
 sizeLoad();
 addEventListener('resize',sizeLoad,{passive:true});

 const loader=new GLTFLoader();
 loader.load('./green_bug_stylized_scifi_car_free.glb',(gltf)=>{
  if(!loadState.active)return;
  const model=gltf.scene;
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  const longest=Math.max(size.x,size.y,size.z);
  const s=3.6/longest;
  model.scale.setScalar(s);
  model.updateMatrixWorld(true);
  const box2=new THREE.Box3().setFromObject(model);
  const c=box2.getCenter(new THREE.Vector3());
  model.position.x-=c.x;
  model.position.y-=box2.min.y;
  model.position.z-=c.z;

  model.traverse(o=>{
   if(o.isMesh){
    o.frustumCulled=false;
    if(o.material){
     const mats=Array.isArray(o.material)?o.material:[o.material];
     mats.forEach(m=>{
      if(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial){
       m.envMapIntensity=1.35;
       m.roughness=Math.min(m.roughness??0.5,0.55);
       m.metalness=Math.max(m.metalness??0.2,0.25);
       m.needsUpdate=true;
      }
     });
    }
   }
  });

  loadState.car=model;
  scene.add(model);
  setLoad(8,'');
 },undefined,(err)=>console.warn('Loading showcase car failed',err));

 function tick(now){
  if(!loadState.active)return;
  loadState.raf=requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-loadState.last)/1000||0.016);
  loadState.last=now;
  // Faster spin
  loadState.angle+=dt*1.85;

  if(loadState.car){
   loadState.car.rotation.y=loadState.angle;
   loadState.car.position.y=Math.sin(now*0.002)*0.05;
  }

  // Light camera sway
  camera.position.x=Math.sin(loadState.angle*0.15)*0.9;
  camera.position.z=6.6+Math.cos(loadState.angle*0.12)*0.35;
  camera.position.y=1.5+Math.sin(loadState.angle*0.2)*0.1;
  camera.lookAt(0,0.55,0);

  renderer.render(scene,camera);
 }
 loadState.last=performance.now();
 loadState.raf=requestAnimationFrame(tick);
}
function destroyLoadingShowcase(){
 loadState.active=false;
 if(loadState.raf)cancelAnimationFrame(loadState.raf);
 if(loadState.renderer){
  loadState.renderer.dispose();
  loadState.renderer.forceContextLoss?.();
 }
 loadState.scene=null;loadState.camera=null;loadState.renderer=null;
 loadState.car=null;
 const canvas=document.getElementById('loadCanvas');
 if(canvas)canvas.style.opacity='0';
}

/* ============================================================
   MENU SCREEN 1 – REAL 3D CAR SHOWCASE
   Uses the supplied green_bug_stylized_scifi_car_free.glb.
   The old 2D cartoon car renderer is disabled below but preserved
   in the source for reference. The active menu uses the real GLB,
   procedural wheel rotation, braking dive, suspension rebound,
   body roll/pitch and smooth drive-in / drive-out motion.
   ============================================================ */
let gameStarted=false;

/*
   ===================== EASY 3D MENU CAR SETTINGS =====================
   Change ONLY these values when you want to move/resize the car.

   SCREEN_X_PERCENT:
     0   = far left
     2  = center
     100 = far right

   SCREEN_Y_PERCENT:
     0   = top
     2  = center
     100 = bottom

   MODEL_SIZE:
     Larger number = bigger 3D car.

   PASS_SPEED:
     Higher = faster drive-in / drive-out.

   BRAKE_DISTANCE:
     Higher = starts braking earlier before the center position.

   STOP_DURATION:
     Seconds the car stays stopped before leaving.

   SPAWN_GAP:
     Delay before the single car repeats after fully leaving the screen.

   SIDE_VIEW_ROTATION:
     If the supplied model faces the wrong direction, change the
     base angle by PI. Normally +PI/2 and -PI/2 give left/right travel.
   =====================================================================
*/
const MENU_CAR_CONFIG={
 ENABLED:true,
 MODEL_URL:'./green_bug_stylized_scifi_car_free.glb',
 MODEL_SIZE:5.4,
 SCREEN_X_PERCENT:40,
 SCREEN_Y_PERCENT:100,
 SCREEN_DEPTH:-1,
 PASS_SPEED:7.8,
 BRAKE_DISTANCE:2.6,
 BRAKE_DECELERATION:9.5,
 STOP_DURATION:2.8,
 SPAWN_GAP:0.85,
 START_MARGIN:5.8,
 EXIT_MARGIN:5.8,
 SUSPENSION_STIFFNESS:105,
 SUSPENSION_DAMPING:17,
 BRAKE_DIVE:0.24,
 REBOUND_AMOUNT:0.16,
 MAX_BOUNCE:0.22,
 BODY_PITCH_AMOUNT:0.10,
 BODY_ROLL_AMOUNT:0.045,
 WHEEL_SPIN_MULTIPLIER:1.15,
 IDLE_BOB:0.025,
 CAMERA_FOV:31,
 CAMERA_HEIGHT:2.55,
 CAMERA_DISTANCE:14.0,
 CAMERA_LOOK_Y:1.15,
 SHADOW_OPACITY:0.50,
 SHADOW_SIZE:4.6,
 SHADOW_BLUR:false,
 LEFT_ROTATION:Math.PI/2,
 RIGHT_ROTATION:-Math.PI/2,
 COLOR_EXPOSURE:0.4
};

const menuState={
 active:false,raf:0,last:0,cars:[],w:1,h:1,
 renderer:null,scene:null,camera:null,shadow:null,
 ready:false,resizeHandler:null,spawnTimer:0
};

function menuResizeRenderer(){
 const canvas=document.getElementById('menuCars');
 if(!canvas||!menuState.renderer||!menuState.camera)return;
 const w=Math.max(1,menuState.w||innerWidth);
 const h=Math.max(1,menuState.h||innerHeight);
 const dpr=Math.min(devicePixelRatio||1,1.35);
 menuState.camera.aspect=w/h;
 menuState.camera.updateProjectionMatrix();
 menuState.renderer.setPixelRatio(dpr);
 menuState.renderer.setSize(w,h,false);
}

function menuScreenAnchor(){
 const camera=menuState.camera;
 if(!camera)return new THREE.Vector3(0,1.15,0);
 const depth=Math.max(0.1,MENU_CAR_CONFIG.CAMERA_DISTANCE+MENU_CAR_CONFIG.SCREEN_DEPTH);
 const halfHeight=Math.tan(THREE.MathUtils.degToRad(MENU_CAR_CONFIG.CAMERA_FOV*.5))*depth;
 const halfWidth=halfHeight*Math.max(.1,menuState.w/menuState.h);
 const x=THREE.MathUtils.mapLinear(MENU_CAR_CONFIG.SCREEN_X_PERCENT,0,100,-halfWidth,halfWidth);
 const y=THREE.MathUtils.mapLinear(MENU_CAR_CONFIG.SCREEN_Y_PERCENT,0,100,halfHeight,-halfHeight)+MENU_CAR_CONFIG.CAMERA_LOOK_Y;
 return new THREE.Vector3(x,y,-MENU_CAR_CONFIG.SCREEN_DEPTH);
}

function menuNormalizeModel(model){
 model.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());
 const longest=Math.max(size.x,size.y,size.z);
 if(longest>0)model.scale.multiplyScalar(MENU_CAR_CONFIG.MODEL_SIZE/longest);
 model.updateMatrixWorld(true);
 const box2=new THREE.Box3().setFromObject(model);
 const center=box2.getCenter(new THREE.Vector3());
 model.position.x-=center.x;
 model.position.y-=box2.min.y;
 model.position.z-=center.z;
 model.updateMatrixWorld(true);
 model.traverse(o=>{
  if(!o.isMesh)return;
  o.frustumCulled=false;
  o.castShadow=true;
  o.receiveShadow=true;
  if(o.material){
   const mats=Array.isArray(o.material)?o.material:[o.material];
   mats.forEach(m=>{
    if((m.isMeshStandardMaterial||m.isMeshPhysicalMaterial)&&!(m.userData&&m.userData.noMenuTune)){
     m.envMapIntensity=Math.max(m.envMapIntensity||0,1.35);
     m.roughness=Math.min(m.roughness??.5,.55);
     m.needsUpdate=true;
    }
   });
  }
 });
}

function getMenuWheelObjects(model){
 const wheels=[];
 model.traverse(o=>{
  if(o.name&&/^Circle\./.test(o.name)){
   if(!o.matrixAutoUpdate){
    o.matrix.decompose(o.position,o.quaternion,o.scale);
    o.matrixAutoUpdate=true;
   }
   wheels.push(o);
  }
 });
 return wheels;
}

function makeMenuCar(fromLeft){
 const model=carModel?carModel.clone(true):null;
 if(!model)return null;
 menuNormalizeModel(model);
 const wheels=getMenuWheelObjects(model);
 const anchor=menuScreenAnchor();
 const startX=fromLeft?anchor.x-MENU_CAR_CONFIG.START_MARGIN:anchor.x+MENU_CAR_CONFIG.START_MARGIN;
 const stopX=anchor.x;
 const stopOffset=fromLeft?0.35:-0.35;
 const direction=fromLeft?1:-1;
 const car={
  model,
  wheels,
  x:startX,
  y:anchor.y,
  z:anchor.z,
  stopX,
  stopOffset,
  direction,
  speed:direction*MENU_CAR_CONFIG.PASS_SPEED,
  speedAbs:MENU_CAR_CONFIG.PASS_SPEED,
  state:'drive',
  brakeT:0,
  idleT:0,
  life:0,
  suspension:0,
  suspensionVelocity:0,
  pitch:0,
  roll:0,
  yaw:fromLeft?MENU_CAR_CONFIG.LEFT_ROTATION:MENU_CAR_CONFIG.RIGHT_ROTATION,
  wheelSpin:0,
  baseScale:model.scale.clone(),
  phase:Math.random()*Math.PI*2
 };
 model.position.set(car.x,car.y,car.z);
 model.rotation.set(0,car.yaw,0,'YXZ');
 menuState.scene.add(model);
 return car;
}

function removeMenuCar(car){
 if(!car)return;
 if(car.model&&car.model.parent)car.model.parent.remove(car.model);
 car.model?.traverse(o=>{
  // Geometry/materials are shared with the game model after clone(true),
  // so do not dispose shared GPU resources here.
 });
}

function updateMenuCar(car,dt){
 if(!car||!car.model)return false;
 car.life+=dt;
 const cfg=MENU_CAR_CONFIG;
 const dir=car.direction;
 const distanceToStop=dir*(car.stopX-car.x);

 if(car.state==='drive'){
  // Cruise until the car reaches the braking envelope. Never overshoot the stop point.
  if(distanceToStop<=cfg.BRAKE_DISTANCE){
   car.state='brake';
   car.brakeT=0;
  }else{
   const step=car.speed*dt;
   car.x+=step;
   car.wheelSpin+=step/cfg.MODEL_SIZE*cfg.WHEEL_SPIN_MULTIPLIER;
   const driveBounce=Math.sin(car.life*13+car.phase)*.035;
   car.suspension=THREE.MathUtils.damp(car.suspension,driveBounce,16,dt);
   car.pitch=THREE.MathUtils.damp(car.pitch,Math.sin(car.life*7+car.phase)*.018,12,dt);
  }
 }

 if(car.state==='brake'){
  car.brakeT+=dt;
  const oldAbs=Math.abs(car.speed);
  // Smooth exponential braking: no sign flip, no reverse/backslide.
  const brakeRate=cfg.BRAKE_DECELERATION*(0.72+0.28*Math.min(1,car.brakeT/.45));
  const newAbs=Math.max(0,oldAbs-brakeRate*dt);
  let step=dir*newAbs*dt;
  const remaining=Math.max(0,distanceToStop);
  if(Math.abs(step)>remaining)step=dir*remaining;
  car.x+=step;
  car.speed=dir*newAbs;
  car.wheelSpin+=step/cfg.MODEL_SIZE*cfg.WHEEL_SPIN_MULTIPLIER;

  // Brake dive, then one controlled rebound. The rebound is damped and cannot push
  // the chassis past the stop point, which removes the visual "backsliding".
  const brakeProgress=Math.min(1,car.brakeT/.42);
  const diveTarget=-cfg.BRAKE_DIVE*Math.min(1,oldAbs/cfg.PASS_SPEED)*(1-brakeProgress*.15);
  const rebound=Math.sin(brakeProgress*Math.PI)*cfg.REBOUND_AMOUNT;
  const suspensionTarget=diveTarget+rebound;
  car.suspension=THREE.MathUtils.damp(car.suspension,suspensionTarget,9.5,dt);
  car.suspensionVelocity=THREE.MathUtils.damp(car.suspensionVelocity,0,cfg.SUSPENSION_DAMPING,dt);
  car.pitch=THREE.MathUtils.damp(car.pitch,diveTarget*.52,11,dt);
  car.roll=THREE.MathUtils.damp(car.roll,Math.sin(car.life*18+car.phase)*cfg.BODY_ROLL_AMOUNT*(1-brakeProgress),16,dt);

  if(newAbs<=.04 || distanceToStop<=.001 || car.brakeT>.95){
   car.speed=0;
   car.x=car.stopX;
   car.state='idle';
   car.idleT=0;
   car.suspensionVelocity=0;
  }
 }

 if(car.state==='idle'){
  car.idleT+=dt;
  // Let the final rebound settle completely before leaving.
  const settle=Math.exp(-car.idleT*3.2);
  const idleBounce=Math.sin(car.idleT*3.4+car.phase)*cfg.IDLE_BOB*settle;
  car.suspension=THREE.MathUtils.damp(car.suspension,idleBounce,7.5,dt);
  car.pitch=THREE.MathUtils.damp(car.pitch,0,8,dt);
  car.roll=THREE.MathUtils.damp(car.roll,Math.sin(car.idleT*2.2+car.phase)*.012*settle,7,dt);
  if(car.idleT>=cfg.STOP_DURATION){
   car.state='leave';
   car.speed=dir*cfg.PASS_SPEED*.92;
  }
 }

 if(car.state==='leave'){
  car.x+=car.speed*dt;
  car.wheelSpin+=car.speed*dt/cfg.MODEL_SIZE*cfg.WHEEL_SPIN_MULTIPLIER;
  car.suspension=THREE.MathUtils.damp(car.suspension,Math.sin(car.life*11+car.phase)*.025,15,dt);
  car.pitch=THREE.MathUtils.damp(car.pitch,Math.sin(car.life*8+car.phase)*.02,10,dt);
  if((dir>0&&car.x>anchorExitX())||(dir<0&&car.x<anchorExitX(true)))return true;
 }

 const vertical=car.suspension+Math.sin(car.life*8+car.phase)*.008;
 car.model.position.set(car.x,car.y+vertical,car.z);
 car.model.rotation.set(
  car.pitch+Math.sin(car.life*5.5+car.phase)*.008,
  car.yaw,
  car.roll,
  'YXZ'
 );

 for(const wheel of car.wheels){
  if(wheel.userData.menuBaseRotationX===undefined)wheel.userData.menuBaseRotationX=wheel.rotation.x;
  wheel.rotation.x=wheel.userData.menuBaseRotationX+car.wheelSpin;
 }
 return false;
}

function anchorExitX(rightSide=false){
 const a=menuScreenAnchor();
 const aspect=Math.max(.1,menuState.w/menuState.h);
 const depth=MENU_CAR_CONFIG.CAMERA_DISTANCE+MENU_CAR_CONFIG.SCREEN_DEPTH;
 const halfH=Math.tan(THREE.MathUtils.degToRad(MENU_CAR_CONFIG.CAMERA_FOV*.5))*depth;
 const halfW=halfH*aspect;
 return a.x+(rightSide?-1:1)*(halfW+MENU_CAR_CONFIG.EXIT_MARGIN);
}

function initMenu3D(){
 if(menuState.renderer||!MENU_CAR_CONFIG.ENABLED)return;
 const canvas=document.getElementById('menuCars');
 if(!canvas)return;

 const scene3=new THREE.Scene();
 scene3.background=null;
 const camera3=new THREE.PerspectiveCamera(
  MENU_CAR_CONFIG.CAMERA_FOV,
  Math.max(1,innerWidth)/Math.max(1,innerHeight),
  .1,
  100
 );
 camera3.position.set(0,MENU_CAR_CONFIG.CAMERA_HEIGHT,MENU_CAR_CONFIG.CAMERA_DISTANCE);
 camera3.lookAt(0,MENU_CAR_CONFIG.CAMERA_LOOK_Y,0);

 const renderer3=new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:true,
  powerPreference:'high-performance',
  depth:true,
  stencil:false
 });
 renderer3.setClearColor(0x000000,0);
 renderer3.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
 renderer3.outputColorSpace=THREE.SRGBColorSpace;
 renderer3.toneMapping=THREE.ACESFilmicToneMapping;
 renderer3.toneMappingExposure=MENU_CAR_CONFIG.COLOR_EXPOSURE;
 renderer3.shadowMap.enabled=true;
 renderer3.shadowMap.type=THREE.PCFSoftShadowMap;

 const hemi3=new THREE.HemisphereLight(0xf2f7ff,0x24303c,1.65);
 scene3.add(hemi3);
 const key3=new THREE.DirectionalLight(0xfff0d2,3.1);
 key3.position.set(-4,7,8);
 key3.castShadow=true;
 key3.shadow.mapSize.set(1024,1024);
 key3.shadow.camera.near=.5;
 key3.shadow.camera.far=35;
 key3.shadow.camera.left=-10;
 key3.shadow.camera.right=10;
 key3.shadow.camera.top=10;
 key3.shadow.camera.bottom=-10;
 key3.shadow.bias=-.0003;
 key3.shadow.normalBias=.03;
 scene3.add(key3);
 const fill3=new THREE.DirectionalLight(0x9fc8ff,1.0);
 fill3.position.set(5,3,-5);
 scene3.add(fill3);

 // Reuse the already-loaded sky texture as the car's reflection environment.
 if(scene.environment)scene3.environment=scene.environment;

 const shadowGeo=new THREE.PlaneGeometry(MENU_CAR_CONFIG.SHADOW_SIZE,MENU_CAR_CONFIG.SHADOW_SIZE);
 const shadowMat=new THREE.ShadowMaterial({opacity:MENU_CAR_CONFIG.SHADOW_OPACITY});
 const shadow=new THREE.Mesh(shadowGeo,shadowMat);
 shadow.rotation.x=-Math.PI/2;
 shadow.position.y=menuScreenAnchor().y-.018;
 shadow.receiveShadow=true;
 scene3.add(shadow);

 menuState.scene=scene3;
 menuState.camera=camera3;
 menuState.renderer=renderer3;
 menuState.shadow=shadow;
 menuState.ready=true;
 menuResizeRenderer();
}

function updateMenuShadow(){
 if(!menuState.shadow)return;
 const a=menuScreenAnchor();
 menuState.shadow.position.set(a.x,a.y-.018,a.z);
 menuState.shadow.scale.setScalar(Math.max(.25,MENU_CAR_CONFIG.MODEL_SIZE/MENU_CAR_CONFIG.SHADOW_SIZE));
}

function createMenuSmokeTexture(){
 const c=document.createElement('canvas');c.width=c.height=128;
 const g=c.getContext('2d');
 const grad=g.createRadialGradient(64,64,2,64,64,62);
 grad.addColorStop(0,'rgba(235,238,242,.72)');
 grad.addColorStop(.28,'rgba(175,181,190,.48)');
 grad.addColorStop(.62,'rgba(105,112,122,.22)');
 grad.addColorStop(1,'rgba(40,44,50,0)');
 g.fillStyle=grad;g.fillRect(0,0,128,128);
 const tex=new THREE.CanvasTexture(c);
 tex.colorSpace=THREE.SRGBColorSpace;
 return tex;
}

function initMenuSmoke(){
 if(menuState.menuSmoke||!menuState.scene)return;
 const texture=createMenuSmokeTexture();
 const group=new THREE.Group();
 group.renderOrder=3;
 const particles=[];
 for(let i=0;i<26;i++){
  const mat=new THREE.SpriteMaterial({
   map:texture,transparent:true,depthWrite:false,depthTest:true,
   opacity:0,blending:THREE.NormalBlending
  });
  const sp=new THREE.Sprite(mat);
  sp.position.set(0,-100,0.12);
  sp.scale.set(.5,.5,1);
  group.add(sp);
  particles.push({sprite:sp,age:10,life:1.2,size:.8,vx:0,vy:0,vz:0,seed:Math.random()*6.283});
 }
 menuState.scene.add(group);
 menuState.menuSmoke={group,particles,texture,head:0,acc:0};
}

function resetMenuSmokeParticle(p,car,power,kind){
 const dir=car.direction;
 const rearX=car.x-dir*(MENU_CAR_CONFIG.MODEL_SIZE*.58);
 const rearY=car.y+.20+(Math.random()-.5)*.22+car.suspension;
 p.age=0;
 p.life=kind===1?.62+Math.random()*.55:1.0+Math.random()*.85;
 p.size=kind===1?.42+Math.random()*.35:.32+Math.random()*.38;
 p.vx=-dir*(.18+Math.random()*.65)*(0.5+power);
 p.vy=.18+Math.random()*.45;
 p.vz=.05+(Math.random()-.5)*.12;
 p.sprite.position.set(rearX+(Math.random()-.5)*.38,rearY+(Math.random()-.5)*.16,car.z-.08);
 p.sprite.scale.setScalar(p.size);
 p.sprite.material.opacity=kind===1?.32+power*.28:.20+power*.22;
 p.sprite.material.rotation=Math.random()*Math.PI*2;
}

function updateMenuSmoke(dt,car){
 const ms=menuState.menuSmoke;
 if(!ms||!car)return;
 const power=car.state==='brake'?Math.min(1,Math.abs(car.speed)/MENU_CAR_CONFIG.PASS_SPEED):car.state==='drive'?.48:car.state==='leave'?.35:.12;
 const emitRate=car.state==='brake'?13:car.state==='drive'?7:2.5;
 ms.acc+=emitRate*power*dt;
 let guard=0;
 while(ms.acc>=1&&guard++<8){
  ms.acc-=1;
  const p=ms.particles[ms.head];ms.head=(ms.head+1)%ms.particles.length;
  resetMenuSmokeParticle(p,car,power,car.state==='brake'?1:0);
 }
 for(const p of ms.particles){
  if(p.age>=p.life){p.sprite.material.opacity=0;continue;}
  p.age+=dt;
  const t=Math.min(1,p.age/p.life);
  p.sprite.position.x+=p.vx*dt;p.sprite.position.y+=p.vy*dt;p.sprite.position.z+=p.vz*dt;
  p.vy+=.035*dt;p.vx*=Math.exp(-.8*dt);p.vz*=Math.exp(-.8*dt);
  p.sprite.scale.setScalar(p.size*(1+t*2.0));
  const fade=t<.12?t/.12:(1-t);
  p.sprite.material.opacity=Math.max(0,fade*(.20+power*.24));
  p.sprite.material.rotation+=dt*(p.seed-.5)*.35;
 }
}

function clearMenuSmoke(){
 const ms=menuState.menuSmoke;
 if(!ms)return;
 for(const p of ms.particles){p.age=p.life+1;p.sprite.material.opacity=0;}
 ms.acc=0;
}

function updateMenuCars(dt){
 if(!menuState.renderer||!menuState.scene)return;
 if(!menuState.ready||!carModel)return;
 updateMenuShadow();
 initMenuSmoke();

 // SCREEN 1 intentionally uses ONE 3D car only.
 // enter -> smooth brake -> suspension settle -> wait -> exit -> repeat.
 if(menuState.cars.length===0){
  const first=makeMenuCar(true);
  if(first)menuState.cars.push(first);
 }
 menuState.spawnTimer-=dt;

 if(menuState.cars.length>0){
  const car=menuState.cars[0];
  const remove=updateMenuCar(car,dt);
  updateMenuSmoke(dt,car);
  if(remove){
   removeMenuCar(car);
   menuState.cars.length=0;
   clearMenuSmoke();
   // Create the next car only after the previous one has completely left.
   menuState.spawnTimer=.22;
  }
 }else if(menuState.spawnTimer<=0){
  const next=makeMenuCar(Math.random()<.5);
  if(next)menuState.cars.push(next);
 }
 menuState.renderer.render(menuState.scene,menuState.camera);
}

function haptic(ms){

 try{
  if(!navigator.vibrate)return;

function ctrlTick(now){
 const dt=Math.min(.04,(now-ctrlLast)/1000||.016);ctrlLast=now;
 let moving=false;
 for(const id in ctrlState){
  const c=ctrlState[id];
  // damped spring: mabilis pagpindot, may kaunting bounce pagbitaw
  const k=c.target?420:230,d=c.target?30:15;
  c.vel+=((c.target-c.v)*k-c.vel*d)*dt;
  c.v+=c.vel*dt;
  if(Math.abs(c.target-c.v)<.002&&Math.abs(c.vel)<.02){c.v=c.target;c.vel=0;}
  else moving=true;
  c.el.style.setProperty('--p',c.v.toFixed(4));
 }
 ctrlRaf=moving?requestAnimationFrame(ctrlTick):0;
}

/* ============================================================
   RELIABLE SKY – uses scene.background (works with EffectComposer)
   This is the official Three.js way for equirectangular sky textures.
   No inverted sphere needed → no black sky, no depth conflicts.
   ============================================================ */
function applySkyTexture(texture){
 texture.colorSpace=THREE.SRGBColorSpace;
 texture.mapping=THREE.EquirectangularReflectionMapping;
 texture.minFilter=THREE.LinearMipmapLinearFilter;
 texture.magFilter=THREE.LinearFilter;
 texture.generateMipmaps=true;
 texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy?.()||4);

}

function worldNormal(hit){
 return hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
}
function groundHit(x,z,originY,maxDistance){
 raycaster.set(new THREE.Vector3(x,originY,z),down);
 raycaster.near=0;
 raycaster.far=maxDistance;
 const hits=raycaster.intersectObjects(colliders,false);
 for(const h of hits){
  if(!h.face)continue;
  if(worldNormal(h).y>.35)return h;
 }
 return null;
}
function findStartGrid(){
 const desiredX=CONFIG.SPAWN_LOCAL_X*CONFIG.MAP_SCALE;
 const desiredZ=CONFIG.SPAWN_LOCAL_Z*CONFIG.MAP_SCALE;
 let best=null,bestD=Infinity;
 for(const mesh of colliders){
  if(!/laguna_seca_road/i.test(mesh.name))continue;
  const pos=mesh.geometry.getAttribute('position');
  const idx=mesh.geometry.index;
  if(!pos)continue;
  const n=idx?idx.count/3:pos.count/3;
  for(let t=0;t<n;t++){
   const ia=idx?idx.getX(t*3):t*3;
   const ib=idx?idx.getX(t*3+1):t*3+1;
   const ic=idx?idx.getX(t*3+2):t*3+2;
   const a=new THREE.Vector3().fromBufferAttribute(pos,ia).applyMatrix4(mesh.matrixWorld);
   const b=new THREE.Vector3().fromBufferAttribute(pos,ib).applyMatrix4(mesh.matrixWorld);
   const c=new THREE.Vector3().fromBufferAttribute(pos,ic).applyMatrix4(mesh.matrixWorld);
   const nrm=b.clone().sub(a).cross(c.clone().sub(a)).normalize();
   if(Math.abs(nrm.y)<.35)continue;
   const p=a.add(b).add(c).multiplyScalar(1/3);
   const dx=p.x-desiredX,dz=p.z-desiredZ,d=dx*dx+dz*dz;
   if(d<bestD){bestD=d;best=p.clone();}
  }
 }
 if(!best){
  const center=mapBox.getCenter(new THREE.Vector3());
  const h=groundHit(center.x,center.z,mapBox.max.y+50,mapBox.getSize(new THREE.Vector3()).y+100);
  if(h)best=h.point.clone();
 }
 if(!best)throw new Error('Hindi makita ang racing road para sa spawn point.');
 const hit=groundHit(best.x,best.z,mapBox.max.y+50,mapBox.getSize(new THREE.Vector3()).y+100);
 if(hit)best.copy(hit.point);
 return best;
}

// ============================================================
const SUN_DIR=new THREE.Vector3(...CONFIG.SHADOW_SUN_OFFSET).normalize();
const _up=new THREE.Vector3(0,1,0),_sx=new THREE.Vector3(),_sy=new THREE.Vector3(),_q=new THREE.Vector3();
let shadowFocusY=null;
function updateShadowFocus(dt){
 const p=vehicle.position;
 shadowFocusY=shadowFocusY===null?p.y:THREE.MathUtils.damp(shadowFocusY,p.y,1.5,dt);
 _sx.crossVectors(_up,SUN_DIR).normalize();
 _sy.crossVectors(SUN_DIR,_sx);
 const texel=(CONFIG.SHADOW_CAM_SIZE*2)/CONFIG.SHADOW_MAP_SIZE;
 _q.set(p.x,shadowFocusY,p.z);
 const a=Math.round(_q.dot(_sx)/texel)*texel;
 const b=Math.round(_q.dot(_sy)/texel)*texel;
 const c=_q.dot(SUN_DIR);
 sun.target.position.set(0,0,0).addScaledVector(_sx,a).addScaledVector(_sy,b).addScaledVector(SUN_DIR,c);
 sun.position.copy(sun.target.position).addScaledVector(SUN_DIR,CONFIG.SHADOW_SUN_DIST);
 sun.target.updateMatrixWorld();
 sun.updateMatrixWorld();
}

 let rs=11;const prng=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};
 [['255,0,0',110],['0,255,0',80]].forEach(([rgb,cnt])=>{
  for(let k=0;k<cnt;k++){
   const an=prng()*6.283,r=Math.sqrt(prng())*80,x=128+Math.cos(an)*r,y=128+Math.sin(an)*r,rad=14+prng()*46;
   const gr=g.createRadialGradient(x,y,0,x,y,rad);
   gr.addColorStop(0,'rgba('+rgb+',0.17)');gr.addColorStop(1,'rgba('+rgb+',0)');
   g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,6.283);g.fill();
  }

 const tex=new THREE.CanvasTexture(cv);

 const uLight={value:new THREE.Vector2(0.4,0.8)};
 const mat=new THREE.ShaderMaterial({
  uniforms:{map:{value:tex},uLight},
  transparent:true,depthWrite:false,depthTest:true,

   attribute vec3 aPos;attribute vec4 aData;attribute vec2 aSeed;
   uniform vec2 uLight;
   varying vec2 vUv;varying vec3 vP;varying vec2 vS;varying vec2 vL;
   void main(){
    vec4 mv=viewMatrix*vec4(aPos,1.0);

    float life=aData.y;
    float a=aData.w*smoothstep(0.0,0.05,life)*pow(max(1.0-life,0.0),1.25);
    vP=vec3(a,life,smoothstep(1.0,4.5,-mv.z));

   }`,
  fragmentShader:`
   uniform sampler2D map;
   varying vec2 vUv;varying vec3 vP;varying vec2 vS;varying vec2 vL;
   void main(){

 let head=0,accB=0,accS=0,accE=0,accP=0,hasPrev=false,wasBrake=false;
 const prev=new THREE.Vector3(),cur=new THREE.Vector3(),lv=new THREE.Vector3();
 const order=[];
 const R=Math.random;

  let mz=0;wheelOffsets.forEach(v=>mz+=v.z);mz/=wheelOffsets.length;

 // kind 0 = brake tire smoke, 1 = wheelspin smoke, 2 = exhaust
 function spawn(x,y,z,fx,fz,kind,power,backAge){
  const i=head;head=(head+1)%N;
  const rx=-fz,rz=fx,side=(R()-.5)*2;
  let back,inh,lat,up,l,a0,a1,am,tn,bu;
  if(kind===0){back=0.8+R()*1.6*power;inh=Math.max(speed,0)*0.32;lat=1.2+power*1.6;up=0.15+R()*0.55;
   l=2.2+R()*1.4+power*0.6;a0=0.5+R()*0.4;a1=4.2+R()*2+power*1.4;am=0.9;tn=0;bu=0.30;}
  else if(kind===1){back=1.2+R()*1.8*power;inh=Math.max(speed,0)*0.2;lat=0.9+power*1.1;up=0.25+R()*0.6;
   l=1.8+R()*1.2;a0=0.5+R()*0.3;a1=3.4+R()*1.6+power;am=0.7;tn=0.12;bu=0.40;}
  else if(kind===3){back=1.0+R()*2.2;inh=Math.max(speed,0)*0.28;lat=1.6;up=0.5+R()*1.3;
   l=0.7+R()*0.6;a0=0.3+R()*0.2;a1=1.6+R()*1.0;am=0.34;tn=0;bu=0.1;}
  else{back=2.5+R()*2.5;inh=Math.max(speed,0)*0.1;lat=0.35;up=0.3+R()*0.5;
   l=1.2+R()*0.8;a0=0.25+R()*0.15;a1=1.6+R()*1.0;am=0.40*(0.6+0.4*power);tn=1;bu=0.95;}
  vx[i]=fx*(inh-back)+rx*side*lat+(R()-.5)*0.5;
  vz[i]=fz*(inh-back)+rz*side*lat+(R()-.5)*0.5;
  vy[i]=up;
  px[i]=x+rx*(R()-.5)*0.4;py[i]=y;pz[i]=z+rz*(R()-.5)*0.4;
  life[i]=l;age[i]=backAge;s0[i]=a0;s1[i]=a1;amul[i]=am*(0.75+0.25*power);tint[i]=tn;buoy[i]=bu;

 function update(dt,gas,brake){
  const h=heading,fx=Math.sin(h),fz=Math.cos(h),ch=Math.cos(h),sh=Math.sin(h);
  cur.copy(vehicle.position);
  if(!hasPrev||cur.distanceTo(prev)>8){prev.copy(cur);hasPrev=true;}
  lv.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  uLight.value.set(lv.x,lv.y);

  const bp=(brake&&speed>1.2)?Math.min(1,0.3+speed/36):0;
  const sp=(gas&&speed>-1&&speed<26)?Math.max(0.25,1-speed/26):0;
  const ex=(gas&&speed>-1)?0.4+0.6*Math.max(0,1-speed/45):0;
  const S=CONFIG.SMOKE_RATE_SCALE;
  accB+=170*bp*S*dt;accS+=85*sp*S*dt;accE+=40*ex*S*dt;
  if(!bp)accB=0;if(!sp)accS=0;if(!ex)accE=0;
  const spr=(weather.wet>0.2&&Math.abs(speed)>5)?Math.min(1,Math.abs(speed)/32)*weather.wet:0;
  accP+=150*spr*S*dt;if(!spr)accP=0;
  if(bp&&!wasBrake)accB+=10*S;   // instant puff the moment you hit the brake
  wasBrake=!!bp;
  const rear=rearOffsets();
  const emit=(kind,power)=>{
   const t=R();
   const bx=prev.x+(cur.x-prev.x)*t,by=prev.y+(cur.y-prev.y)*t,bz=prev.z+(cur.z-prev.z)*t;
   let ox,oz,oy=kind===2?0.35:0.12;
   if(kind===2){
    const xh=carExhaust();                                   // BMW: single left pipe | green buggy: both sides (unchanged)
    if(xh){ox=xh.x;oz=xh.z;oy=xh.y;}
    else{ox=(R()<.5?-0.45:0.45);oz=-CONFIG.CAR_LENGTH*.5;}
   }
   else{const o=rear[(R()*rear.length)|0];ox=o.x;oz=o.z;}
   spawn(bx+ox*ch+oz*sh,by+oy,bz-ox*sh+oz*ch,fx,fz,kind,power,(1-t)*dt);
  };
  let guard=0;
  while(accB>=1&&guard++<24){accB-=1;emit(0,bp);}
  while(accS>=1&&guard++<36){accS-=1;emit(1,sp);}
  while(accE>=1&&guard++<44){accE-=1;emit(2,ex);}
  while(accP>=1&&guard++<80){accP-=1;emit(3,spr);}
  prev.copy(cur);

  order.length=0;
  const dragK=Math.exp(-1.25*dt),dragY=Math.exp(-0.8*dt);
  for(let i=0;i<N;i++){
   if(age[i]>=life[i])continue;
   age[i]+=dt;
   if(age[i]>=life[i])continue;
   const l=age[i]/life[i],t=age[i]*1.3+seed[i]*40,tb=0.3+l*1.2;
   vx[i]=vx[i]*dragK+(Math.sin(t+pz[i]*.5)*1.1+Math.sin(t*2.3+py[i]*1.1)*.5+0.25)*tb*dt;
   vz[i]=vz[i]*dragK+(Math.cos(t*1.2+px[i]*.5)*1.1+Math.cos(t*2.1+py[i]*.9)*.5)*tb*dt;
   vy[i]=vy[i]*dragY+(buoy[i]*(1-l)+Math.sin(t*1.7+px[i]*.6)*.3*tb)*dt;
   px[i]+=vx[i]*dt;py[i]+=vy[i]*dt;pz[i]+=vz[i]*dt;
   rot[i]+=rotV[i]*dt;
   const dx=px[i]-camera.position.x,dy=py[i]-camera.position.y,dz=pz[i]-camera.position.z;
   d2[i]=dx*dx+dy*dy+dz*dz;
   order.push(i);
  }
  order.sort((a,b)=>d2[b]-d2[a]);
  const P=aPos.array,D=aData.array,Sd=aSeed.array;
  for(let k=0;k<N;k++){
   if(k<order.length){
    const i=order[k],l=age[i]/life[i],e=1-(1-l)*(1-l),size=s0[i]+(s1[i]-s0[i])*e;
    P[k*3]=px[i];P[k*3+1]=py[i]+size*0.35;P[k*3+2]=pz[i];
    D[k*4]=size;D[k*4+1]=l;D[k*4+2]=rot[i];D[k*4+3]=amul[i];
    Sd[k*2]=seed[i];Sd[k*2+1]=tint[i];
   }else{D[k*4]=0;}
  }
  aPos.needsUpdate=true;aData.needsUpdate=true;aSeed.needsUpdate=true;
 }
 return{update};
})();

// ============================================================
//  REALISTIC TIRE MARKS v1 – skid marks left in REAL TIME while braking
//  • Works on the road (black burnt rubber with tread ribs, patchy grain)
//    AND on grass / dirt (pressed dark trench + pushed-up soil ridges)
//  • Positions are computed from the car model's REAL tire geometry
//    (axle centre, tire radius, tread width read from the wheel meshes),
//    then projected on the real ground under each tire every frame.
//  • Front tires press harder than rear, outer tires press harder in a
//    turn, marks start light, get darker as speed/pressure rises.
//  • Locked-wheel look: wheels almost stop spinning while the marks are laid.
//  • One ring-buffer mesh (no new raycasts: re-uses the wheel ground hits).
// ============================================================
const TM_CFG={
 SEG_MAX:(matchMedia('(pointer:coarse)').matches?5000:8000), // max stored mark segments (oldest are recycled)
 SEG_LEN:0.25,        // metres per mark segment
 MIN_SPEED:2.5,       // m/s – below this no marks (about 9 km/h)
 GAP_MAX:0.30,        // tire must be this close to the ground to leave a mark (airborne = no mark)
 LIFT:0.014,          // metres above the surface (anti z-fight)
 CONTACT:0.92,        // visible contact patch = 92% of tread width
 RIBBON:1.28,         // ribbon is wider than the tread so dirt ridges can show on the sides
 FRONT_LOAD:1.0,      // braking weight transfer: front tires leave darker marks
 REAR_LOAD:0.8,
 LOCK_WHEELS:true,    // wheels (almost) stop turning while skidding
 LOCK_SPIN:0.08,
 LOG_SURFACES:true,   // prints map surface names in the console once, so you can tune the rules below
 ROAD_RX:/road|asphalt|tarmac|pit|track|lane|race|curb|kerb|apron/i,
 DIRT_RX:/sand|dirt|gravel|mud|soil|clay|dust|trap|rock|stone/i,
 GRASS_RX:/grass|lawn|turf|field|meadow|green|veg|bush|plant/i,
 UNKNOWN_SURFACE:1.6  // unknown mesh = dry grass/dirt mix (0 asphalt, 1 grass, 2 dirt)
};
const TIREMARKS=(()=>{
 const C=TM_CFG,N=C.SEG_MAX;
 const pos=new Float32Array(N*12),uvA=new Float32Array(N*8),dat=new Float32Array(N*16);
 const idx=new Uint16Array(N*6);
 for(let k=0;k<N;k++){const b=k*4,o=k*6;idx[o]=b;idx[o+1]=b+1;idx[o+2]=b+2;idx[o+3]=b+2;idx[o+4]=b+1;idx[o+5]=b+3;}
 const aPos=new THREE.BufferAttribute(pos,3),aUV=new THREE.BufferAttribute(uvA,2),aDat=new THREE.BufferAttribute(dat,4);
 [aPos,aUV,aDat].forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',aPos);geo.setAttribute('aUV',aUV);geo.setAttribute('aData',aDat);
 geo.setIndex(new THREE.BufferAttribute(idx,1));
 geo.setDrawRange(0,0);

 const uniforms={uWet:{value:0},uDim:{value:1},uZone:{value:1/C.RIBBON}};
 const mat=new THREE.ShaderMaterial({
  uniforms,transparent:true,depthWrite:false,depthTest:true,side:THREE.DoubleSide,
  polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4,
  vertexShader:`
   attribute vec2 aUV;attribute vec4 aData;
   varying vec2 vUV;varying vec4 vData;
   void main(){
    vUV=aUV;vData=aData;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
   }`,
  fragmentShader:`
   uniform float uWet,uDim,uZone;
   varying vec2 vUV;varying vec4 vData;
   float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
   float vn(vec2 p){
    vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
    return mix(mix(h12(i),h12(i+vec2(1.0,0.0)),f.x),mix(h12(i+vec2(0.0,1.0)),h12(i+vec2(1.0,1.0)),f.x),f.y);
   }
   void main(){
    float I=vData.x,S=vData.y,seed=vData.z,bias=vData.w;
    float t=(vUV.x-0.5)*2.0;          // -1..1 across the whole ribbon
    float x=t/uZone;                   // -1..1 across the real tire tread
    float ax=abs(x);
    float v=vUV.y;
    float grain=vn(vec2(x*34.0+seed,v*19.0));
    float streak=vn(vec2(x*9.0+seed*1.7,v*0.7));
    float clump=vn(vec2(x*1.6+seed*0.37,v*0.55));
    float edgeN=vn(vec2(v*5.0+seed,x*3.0));
    float torn=vn(vec2(x*3.2+seed,v*2.6));
    float rib=smoothstep(-0.45,0.55,cos(x*14.137));          // 5 tread ribs, grooves in between
    float load=clamp(1.0+bias*x*0.5,0.45,1.5)*(1.0+0.18*ax*ax); // cornering pushes one shoulder harder

    // ---------- ASPHALT: burnt rubber ----------
    float inA=1.0-smoothstep(0.84,1.0,ax+(edgeN-0.5)*0.16);
    float pat=mix(0.55,1.15,clump)*mix(0.65,1.0,streak)*mix(0.70,1.0,grain);
    float aA=clamp(I*inA*mix(0.50,1.0,rib)*pat*load*0.92,0.0,0.93);
    aA*=1.0-0.32*uWet;
    vec3 cA=vec3(0.008,0.008,0.010)+vec3(0.010)*grain;

    // ---------- GRASS / DIRT: pressed trench + soil ridges ----------
    float inS=1.0-smoothstep(0.88,1.0,ax+(edgeN-0.5)*0.22);
    float fl=fract(v*4.2+ax*1.7);
    float lug=smoothstep(0.30,0.55,fl)*(1.0-smoothstep(0.80,1.0,fl));
    float aT=I*0.70*inS*mix(0.78,1.0,lug)*mix(0.45,1.15,torn);
    float rz=smoothstep(0.92,1.06,ax)*(1.0-smoothstep(1.12,1.28,ax));
    float aR=I*0.30*rz*mix(0.4,1.0,torn);
    float dW=clamp(S-1.0,0.0,1.0);
    vec3 trenchC=mix(vec3(0.020,0.026,0.008),vec3(0.050,0.032,0.018),dW);
    vec3 ridgeC=mix(vec3(0.10,0.12,0.04),vec3(0.20,0.14,0.08),dW);
    float aS=clamp(max(aT,aR)*(1.0+0.25*uWet),0.0,0.85);
    vec3 cS=mix(trenchC,ridgeC,aR/max(aT+aR,0.0001))*uDim;

    float wA=1.0-clamp(S,0.0,1.0);
    float alpha=mix(aS,aA,wA);
    if(alpha<0.004)discard;
    gl_FragColor=vec4(mix(cS,cA,wA),alpha);
   }`
 });
 const mesh=new THREE.Mesh(geo,mat);
 mesh.frustumCulled=false;mesh.renderOrder=2;mesh.visible=false;scene.add(mesh);

 let head=0,total=0,tires=null,spinK=1;
 const states=[];
 const mk=()=>({has:false,v:0,seed:0,base:0,S:0,B:0,P:new THREE.Vector3(),A:new THREE.Vector3(),N:new THREE.Vector3(),pL:new THREE.Vector3(),pR:new THREE.Vector3()});
 const Cw=new THREE.Vector3(),nn=new THREE.Vector3(),AA=new THREE.Vector3(),PP=new THREE.Vector3();
 const cP=new THREE.Vector3(),cA=new THREE.Vector3(),cN=new THREE.Vector3(),cL=new THREE.Vector3(),cR=new THREE.Vector3();
 const seen=new Set();
 const ramp=v=>0.10+0.90*THREE.MathUtils.smoothstep(v,0,1.4);

 // Which surface is under the tire? (0 asphalt, 1 grass, 2 dirt) – cached per mesh
 function surfaceOf(o){
  let s=o.userData.tmSurface;
  if(s!==undefined)return s;
  const mats=Array.isArray(o.material)?o.material:[o.material];
  const nm=(o.name||'')+' '+mats.map(m=>(m&&m.name)||'').join(' ');
  s=C.ROAD_RX.test(nm)?0:C.DIRT_RX.test(nm)?2:C.GRASS_RX.test(nm)?1:C.UNKNOWN_SURFACE;
  o.userData.tmSurface=s;
  if(C.LOG_SURFACES&&!seen.has(nm)){
   seen.add(nm);
   console.info('[TireMarks] surface "'+nm.trim()+'" =>',s===0?'asphalt':s===1?'grass':s===2?'dirt':'unknown (soft ground)');
  }
  return s;
 }

 // Read the REAL tire geometry from the wheel meshes of the car model
 function buildTires(){
  vehicle.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(vehicle.matrixWorld).invert();
  const list=[];
  const v3=new THREE.Vector3();
  wheelObjects.forEach(w=>{
   w.updateWorldMatrix(true,true);
   const Wm=new THREE.Matrix4().multiplyMatrices(inv,w.matrixWorld);      // wheel-local -> vehicle space
   const wInv=new THREE.Matrix4().copy(w.matrixWorld).invert();
   const pts=[];let maxR=0;
   w.traverse(m=>{
    if(!m.isMesh||!m.geometry)return;
    const pa=m.geometry.getAttribute('position');if(!pa)return;
    const M=new THREE.Matrix4().multiplyMatrices(wInv,m.matrixWorld);
    for(let i=0;i<pa.count;i++){
     v3.fromBufferAttribute(pa,i).applyMatrix4(M);
     pts.push(v3.x,v3.y,v3.z);
     maxR=Math.max(maxR,Math.hypot(v3.y,v3.z));
    }
   });
   if(!pts.length||maxR<=0)return;
   let x0=Infinity,x1=-Infinity;
   for(let i=0;i<pts.length;i+=3){
    if(Math.hypot(pts[i+1],pts[i+2])>=maxR*0.965){x0=Math.min(x0,pts[i]);x1=Math.max(x1,pts[i]);}
   }
   const sc=new THREE.Vector3().setFromMatrixScale(Wm).x;
   list.push({
    center:new THREE.Vector3((x0+x1)*0.5,0,0).applyMatrix4(Wm),   // axle centre, middle of the tread
    axle:new THREE.Vector3(1,0,0).transformDirection(Wm),
    R:maxR*sc,width:Math.max(0.12,(x1-x0)*sc),front:false
   });
  });
  if(list.length<wheelOffsets.length||list.length<2){
   list.length=0;
   wheelOffsets.forEach(o=>list.push({center:new THREE.Vector3(o.x,wheelRadius,o.z),axle:new THREE.Vector3(1,0,0),R:wheelRadius,width:0.3,front:false}));
  }else{
   wheelRadius=list.reduce((s,t)=>s+t.R,0)/list.length;  // true tire radius -> wheels roll at the correct speed
  }
  let mz=0;list.forEach(t=>mz+=t.center.z);mz/=list.length;
  list.forEach(t=>{t.front=t.center.z>mz;});
  tires=list;
 }

 function edges(L,R,Pt,Nn,Av,half){
  L.set(Pt.x+Nn.x*C.LIFT-Av.x*half,Pt.y+Nn.y*C.LIFT-Av.y*half,Pt.z+Nn.z*C.LIFT-Av.z*half);
  R.set(Pt.x+Nn.x*C.LIFT+Av.x*half,Pt.y+Nn.y*C.LIFT+Av.y*half,Pt.z+Nn.z*C.LIFT+Av.z*half);
 }
 function pushSeg(aL,aR,bL,bR,v0,v1,i0,i1,s0,s1,b0,b1,seed){
  const k=head;head=(head+1)%N;total++;
  let p=k*12;
  pos[p]=aL.x;pos[p+1]=aL.y;pos[p+2]=aL.z;pos[p+3]=aR.x;pos[p+4]=aR.y;pos[p+5]=aR.z;
  pos[p+6]=bL.x;pos[p+7]=bL.y;pos[p+8]=bL.z;pos[p+9]=bR.x;pos[p+10]=bR.y;pos[p+11]=bR.z;
  p=k*8;
  uvA[p]=0;uvA[p+1]=v0;uvA[p+2]=1;uvA[p+3]=v0;uvA[p+4]=0;uvA[p+5]=v1;uvA[p+6]=1;uvA[p+7]=v1;
  p=k*16;
  dat[p]=i0;dat[p+1]=s0;dat[p+2]=seed;dat[p+3]=b0;
  dat[p+4]=i0;dat[p+5]=s0;dat[p+6]=seed;dat[p+7]=b0;
  dat[p+8]=i1;dat[p+9]=s1;dat[p+10]=seed;dat[p+11]=b1;
  dat[p+12]=i1;dat[p+13]=s1;dat[p+14]=seed;dat[p+15]=b1;
 }
 function flag(a,per,seg0,cnt){
  if(!a.addUpdateRange){a.needsUpdate=true;return;}
  const put=(s,c)=>a.addUpdateRange(s*4*per,c*4*per);
  if(seg0+cnt<=N)put(seg0,cnt);else{put(seg0,N-seg0);put(0,seg0+cnt-N);}
  a.needsUpdate=true;
 }

 function update(dt,braking,contacts){
  if(!tires)buildTires();
  vehicle.updateMatrixWorld(true);
  const want=braking&&speed>C.MIN_SPEED&&grounded;
  const spK=THREE.MathUtils.smoothstep(Math.abs(speed),C.MIN_SPEED,26);
  const head0=head,tot0=total;
  let any=false;
  for(let i=0;i<tires.length;i++){
   const T=tires[i],st=states[i]||(states[i]=mk());
   const hit=want&&contacts?contacts[i]:null;
   if(!hit||!hit.face){st.has=false;continue;}
   // exact tire position in the world, then onto the real ground plane under it
   Cw.copy(T.center).applyMatrix4(vehicle.matrixWorld);
   nn.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);
   const d=(Cw.x-hit.point.x)*nn.x+(Cw.y-hit.point.y)*nn.y+(Cw.z-hit.point.z)*nn.z;
   const gap=d-T.R;
   if(gap>C.GAP_MAX||gap<-0.25){st.has=false;continue;}
   PP.copy(Cw).addScaledVector(nn,-d);                       // contact point of the tire
   AA.copy(T.axle).transformDirection(vehicle.matrixWorld);
   AA.addScaledVector(nn,-AA.dot(nn)).normalize();           // tire width direction along the ground
   const s=surfaceOf(hit.object);
   const lat=-Math.sign(T.center.x)*steer;                   // + = outer tire in the turn
   const base=(0.30+0.70*spK)*(T.front?C.FRONT_LOAD:C.REAR_LOAD)*(1+0.25*lat*spK);
   const bias=-steer*spK;
   const half=T.width*C.CONTACT*C.RIBBON*0.5;
   any=true;
   if(!st.has||st.P.distanceToSquared(PP)>16){                // start of a new skid mark
    st.has=true;st.v=0;st.seed=Math.random()*180;
    st.P.copy(PP);st.A.copy(AA);st.N.copy(nn);st.base=base;st.S=s;st.B=bias;
    edges(st.pL,st.pR,PP,nn,AA,half);
    continue;
   }
   const dist=st.P.distanceTo(PP);
   if(dist<C.SEG_LEN)continue;
   const k=Math.max(1,Math.round(dist/C.SEG_LEN));
   let pBase=st.base,pS=st.S,pB=st.B,pv=st.v;
   for(let j=1;j<=k;j++){
    const f=j/k;
    cP.lerpVectors(st.P,PP,f);
    cA.lerpVectors(st.A,AA,f).normalize();
    cN.lerpVectors(st.N,nn,f).normalize();
    const cBase=st.base+(base-st.base)*f,cS=st.S+(s-st.S)*f,cB=st.B+(bias-st.B)*f;
    const cv=st.v+dist*f;
    edges(cL,cR,cP,cN,cA,half);
    pushSeg(st.pL,st.pR,cL,cR,pv,cv,pBase*ramp(pv),cBase*ramp(cv),pS,cS,pB,cB,st.seed);
    st.pL.copy(cL);st.pR.copy(cR);
    pBase=cBase;pS=cS;pB=cB;pv=cv;
   }
   st.v+=dist;st.P.copy(PP);st.A.copy(AA);st.N.copy(nn);st.base=base;st.S=s;st.B=bias;
  }
  // locked-wheel look
  const target=(any&&C.LOCK_WHEELS)?C.LOCK_SPIN:1;
  spinK=THREE.MathUtils.damp(spinK,target,any?18:6,dt);
  // upload only the segments written this frame
  const cnt=total-tot0;
  if(cnt>0){
   flag(aPos,3,head0,cnt);flag(aUV,2,head0,cnt);flag(aDat,4,head0,cnt);
   geo.setDrawRange(0,Math.min(total,N)*6);
   mesh.visible=true;
  }
  uniforms.uWet.value=weather.wet;
  uniforms.uDim.value=1-0.45*weather.rain;
 }
 function clear(){
  head=0;total=0;geo.setDrawRange(0,0);mesh.visible=false;
  states.forEach(s=>{s.has=false;});
 }
 return{update,clear,rebuild(){tires=null;states.forEach(s=>{s.has=false;});},get spinK(){return spinK;}};
})();

// ============================================================
//  WIGGLE – tap LEFT / RIGHT quickly and the car wiggles (visual only)
// ============================================================
const CONFIG_WIGGLE={WINDOW_MS:420,YAW:0.12,ROLL:0.08,PITCH:0.012,DECAY:1.1};
const wig={energy:0,lastT:0,lastDir:0,phase:0,yaw:0,roll:0,pitch:0};
function steerTap(dir){
 const now=performance.now(),gap=now-wig.lastT;
 if(wig.lastT>0&&gap<CONFIG_WIGGLE.WINDOW_MS){
  const quick=1-gap/CONFIG_WIGGLE.WINDOW_MS;           // faster taps = stronger wiggle
  wig.energy=Math.min(1.4,wig.energy+0.28+quick*0.35+(dir!==wig.lastDir?0.18:0));
 }
 wig.lastT=now;wig.lastDir=dir;
}
document.getElementById('left').addEventListener('pointerdown',()=>steerTap(1));
document.getElementById('right').addEventListener('pointerdown',()=>steerTap(-1));
addEventListener('keydown',e=>{
 if(e.repeat)return;
 const k=e.key.toLowerCase();
 if(k==='a'||k==='arrowleft')steerTap(1);
 else if(k==='d'||k==='arrowright')steerTap(-1);
});
function updateWiggle(dt){
 wig.energy=Math.max(0,wig.energy-CONFIG_WIGGLE.DECAY*dt);
 const E=THREE.MathUtils.smoothstep(Math.min(1,wig.energy),0.12,0.6);
 wig.phase+=dt*(13+11*E);
 const s=Math.sin(wig.phase),k=1-Math.exp(-28*dt);
 wig.yaw+=(s*CONFIG_WIGGLE.YAW*E-wig.yaw)*k;
 wig.roll+=(-s*CONFIG_WIGGLE.ROLL*E-wig.roll)*k;
 wig.pitch+=(Math.sin(wig.phase*2)*CONFIG_WIGGLE.PITCH*E-wig.pitch)*k;
}

const COARSE=matchMedia('(pointer:coarse)').matches;
const RAIN_CFG={
 DURATION:12,RAMP_IN:2.2,RAMP_OUT:3.5,      // seconds (total rain time, fade in, fade out)
 AUTO:true,AUTO_MIN:40,AUTO_MAX:85,FIRST_DELAY:30, // random rain every 40-85 s (or press RAIN)
 DROPS:COARSE?2200:3600,BOX_W:40,BOX_H:28,WIDTH_PX:1.8,SPLASHES:COARSE?70:110

const weather={rain:0,wet:0,active:false,timer:0,next:RAIN_CFG.FIRST_DELAY,flashAt:-1,flashT:-1,thunderIn:-1,lastWet:-1,ready:false,accSp:0};
const FOG_CLEAR=new THREE.Color(0x9db8c5),FOG_RAIN=new THREE.Color(0x4f5a64);

// --- streak drops (instanced screen-aligned ribbons, fully GPU animated) ---
const rainMesh=(()=>{
 const N=RAIN_CFG.DROPS;
 const q=new THREE.BufferGeometry();
 q.setAttribute('position',new THREE.Float32BufferAttribute([-.5,0,0,.5,0,0,-.5,1,0,.5,1,0],3));
 q.setIndex([0,1,2,2,1,3]);
 const geo=new THREE.InstancedBufferGeometry();
 geo.index=q.index;geo.setAttribute('position',q.attributes.position);
 const r=new Float32Array(N*4);for(let i=0;i<r.length;i++)r[i]=Math.random();
 geo.setAttribute('aR',new THREE.InstancedBufferAttribute(r,4));
 geo.instanceCount=N;
 const mat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uInt:{value:0},uBW:{value:RAIN_CFG.BOX_W},uBH:{value:RAIN_CFG.BOX_H},
   uW:{value:RAIN_CFG.WIDTH_PX},uCam:{value:new THREE.Vector3()},uV:{value:new THREE.Vector2()},uRes:{value:new THREE.Vector2(1,1)}},
  transparent:true,depthWrite:false,depthTest:true,side:THREE.DoubleSide,
  vertexShader:`
   attribute vec4 aR;
   uniform float uTime,uInt,uBW,uBH,uW;uniform vec3 uCam;uniform vec2 uV,uRes;
   varying float vA;varying vec2 vQ;
   void main(){
    float show=step(fract(aR.x*17.37+aR.y*31.7),uInt);
    float fall=9.0+aR.w*4.0;
    float fx=fract(aR.x-uCam.x/uBW),fz=fract(aR.y-uCam.z/uBW),fy=fract(aR.z-uTime*fall/uBH);
    vec3 p=vec3(uCam.x+(fx-0.5)*uBW,uCam.y-uBH*0.45+fy*uBH,uCam.z+(fz-0.5)*uBW);
    vec3 vel=vec3(uV.x,-fall,uV.y);
    vec3 top=p-normalize(vel)*(0.7+aR.w*1.0);
    mat4 VP=projectionMatrix*viewMatrix;
    vec4 a=VP*vec4(p,1.0),b=VP*vec4(top,1.0);
    if(a.w<0.1||b.w<0.1||show<0.5){gl_Position=vec4(2.0,2.0,2.0,1.0);vA=0.0;vQ=vec2(0.0);return;}
    vec2 dp=(b.xy/b.w-a.xy/a.w)*uRes*0.5;float L=length(dp);
    vec2 dn=L>0.001?dp/L:vec2(0.0,1.0);
    vec2 nrm=vec2(-dn.y,dn.x);
    vec4 c=mix(a,b,position.y);
    c.xy+=nrm*position.x*uW*2.0/uRes*c.w;
    gl_Position=c;
    vA=(1.0-smoothstep(10.0,uBW*0.55,a.w))*smoothstep(0.8,2.5,a.w)*(1.0-position.y*0.55);
    vQ=vec2(position.x*2.0,position.y);
   }`,
  fragmentShader:`
   varying float vA;varying vec2 vQ;
   void main(){
    float al=vA*(1.0-vQ.x*vQ.x);
    if(al<0.01)discard;
    gl_FragColor=vec4(0.86,0.91,1.0,min(al*0.9,0.85));
   }`
 });
 const m=new THREE.Mesh(geo,mat);m.frustumCulled=false;m.renderOrder=6;m.visible=false;scene.add(m);
 return m;
})();

// --- ground ripples near the car ---
const splash=(()=>{
 const N=RAIN_CFG.SPLASHES;

 const attr=new THREE.InstancedBufferAttribute(P,4);attr.setUsage(THREE.DynamicDrawUsage);

 geo.setAttribute('aP',attr);geo.instanceCount=N;

  transparent:true,depthWrite:false,depthTest:true,side:THREE.DoubleSide,

   attribute vec4 aP;varying vec2 vUv;varying float vT;
   void main(){

    vUv=uv;vT=aP.w;

   }`,
  fragmentShader:`
   varying vec2 vUv;varying float vT;
   void main(){

  weather.accSp+=rate*dt;

   const an=Math.random()*6.283,rd=Math.sqrt(Math.random())*11;
   P[i*4]=vehicle.position.x+Math.cos(an)*rd;
   P[i*4+1]=vehicle.position.y-CONFIG.RIDE_HEIGHT+0.03;
   P[i*4+2]=vehicle.position.z+Math.sin(an)*rd;
   P[i*4+3]=0;age[i]=0;life[i]=0.35+Math.random()*0.3;
  }

// --- sound (starts after the first tap / key press) ---
let rainAudio=null;
function initRainAudio(){
 if(rainAudio){rainAudio.ctx.resume?.();return;}
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=new AC(),len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const chain=(type,f)=>{
   const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;
   const flt=ctx.createBiquadFilter();flt.type=type;flt.frequency.value=f;
   const gn=ctx.createGain();gn.gain.value=0;
   s.connect(flt);flt.connect(gn);gn.connect(ctx.destination);s.start();
   return gn;
  };
  const rain=chain('highpass',900),thunder=chain('lowpass',160);
  rainAudio={ctx,rain,thunder};
 }catch(_){}
}
['pointerdown','keydown'].forEach(t=>addEventListener(t,initRainAudio,{passive:true}));
function thunder(){
 if(!rainAudio)return;
 const t=rainAudio.ctx.currentTime,g=rainAudio.thunder.gain;
 g.cancelScheduledValues(t);g.setTargetAtTime(0.9,t,0.08);g.setTargetAtTime(0,t+0.5,0.9);
}

// --- weather control ---
function startRain(){
 weather.active=true;weather.timer=0;
 weather.flashAt=Math.random()<0.65?3+Math.random()*(RAIN_CFG.DURATION-7):-1;
}
document.querySelector('#rain').onclick=()=>{if(!weather.active)startRain();};

// --- wet surfaces ---
const wetList=[];
function collectWetMats(){
 const seen=new Set();
 const add=(o,k)=>{
  if(!o.isMesh||!o.material)return;
  (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
   if(seen.has(m)||m.roughness===undefined||!m.color)return;
   seen.add(m);
   wetList.push({m,c:m.color.clone(),r:m.roughness,e:m.envMapIntensity??1,
    k:k===0?0:(/road|asphalt/i.test(o.name+' '+(m.name||''))?2:1)});
  });
 };
 mapRoot.traverse(o=>add(o,1));
 carModel.traverse(o=>add(o,0));
 weather.ready=true;
}
function applyWet(w){
 const L=THREE.MathUtils.lerp;
 for(const it of wetList){
  const m=it.m;
  if(it.k===2){m.color.copy(it.c).multiplyScalar(L(1,0.5,w));m.roughness=L(it.r,0.1,w);m.envMapIntensity=L(it.e,2.4,w);}
  else if(it.k===1){m.color.copy(it.c).multiplyScalar(L(1,0.74,w));m.roughness=L(it.r,Math.max(0.22,it.r*0.55),w);m.envMapIntensity=L(it.e,it.e*1.5,w);}
  else{m.color.copy(it.c).multiplyScalar(L(1,0.92,w));m.roughness=L(it.r,it.r*0.55,w);m.envMapIntensity=L(it.e,it.e*1.4,w);}
 }
}

function updateWeather(dt){
 const C=RAIN_CFG,w=weather,L=THREE.MathUtils.lerp;
 if(w.active){
  w.timer+=dt;
  if(w.timer>=C.DURATION){w.active=false;w.next=C.AUTO_MIN+Math.random()*(C.AUTO_MAX-C.AUTO_MIN);}
 }else if(C.AUTO){w.next-=dt;if(w.next<=0)startRain();}
 const k=w.active?Math.max(0,Math.min(1,w.timer/C.RAMP_IN,(C.DURATION-w.timer)/C.RAMP_OUT)):0;
 w.rain=k*k*(3-2*k);
 const tw=w.rain>0.04?1:0;
 w.wet+=(tw-w.wet)*(1-Math.exp(-(tw?1.4:0.55)*dt));
 if(!tw&&w.wet<0.003)w.wet=0;

 // lightning
 if(w.active&&w.flashAt>=0&&w.timer>=w.flashAt){w.flashAt=-1;w.flashT=0;w.thunderIn=0.6+Math.random()*0.9;}
 let flash=0;
 if(w.flashT>=0){w.flashT+=dt;flash=Math.exp(-w.flashT*7)*(0.6+0.4*Math.sin(w.flashT*60));if(w.flashT>1.2)w.flashT=-1;}
 if(w.thunderIn>=0){w.thunderIn-=dt;if(w.thunderIn<0)thunder();}

 // darker, misty mood
 const r=w.rain;
 scene.backgroundIntensity=L(1,0.4,r)+flash*1.4;
 sun.intensity=L(2.6,0.85,r)+flash*1.5;
 hemi.intensity=L(1.2,0.75,r)+flash*1.2;
 renderer.toneMappingExposure=L(1.05,0.7,r)+flash*0.9;
 if(scene.fog){scene.fog.color.lerpColors(FOG_CLEAR,FOG_RAIN,r);scene.fog.near=L(2000,140,r);scene.fog.far=L(5000,1500,r);}

 // wet road / surfaces
 if(!w.ready&&mapRoot&&carModel)collectWetMats();
 if(w.ready&&Math.abs(w.wet-w.lastWet)>0.003){applyWet(w.wet);w.lastWet=w.wet;}

 // sound
 if(rainAudio){
  const t=rainAudio.ctx.currentTime;
  rainAudio.rain.gain.setTargetAtTime(0.16*r,t,0.15);
 }

 // streaks + ripples
 const vis=r>0.005;
 rainMesh.visible=vis;splash.mesh.visible=vis;
 if(vis){
  const u=rainMesh.material.uniforms;
  renderer.getDrawingBufferSize(_dbs);
  u.uTime.value=performance.now()/1000;
  u.uInt.value=r;
  u.uCam.value.copy(camera.position);
  u.uRes.value.copy(_dbs);
  u.uW.value=C.WIDTH_PX*renderer.getPixelRatio();
  u.uV.value.set(1.5-Math.sin(heading)*speed*0.16,0.6-Math.cos(heading)*speed*0.16);
  splash.update(dt,140*r);
 }
}

const PLAYER_CFG={

function normalizeFBXObject(obj){

  if(o.isMesh){o.castShadow=true;o.receiveShadow=true;
   if(o.material){
    const mats=Array.isArray(o.material)?o.material:[o.material];

function makePlayerAction(clip,name){

 const action=playerMixer.clipAction(clip);

 if(name==='idle')action.setLoop(THREE.LoopRepeat,Infinity);
 else if(name==='jump')action.setLoop(THREE.LoopOnce,1);

   const left=Math.abs(p.x-carWorldBox.min.x),right=Math.abs(carWorldBox.max.x-p.x);

const AUDIO_CFG={

 IDLE_RISE:3.4,            // how fast idle comes back after releasing gas

const CAR_AUDIO=(()=>{

  raw[k]=fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();})
   .catch(e=>{console.warn('Audio file not found/failed:',u,e);return null;});

 for(let i=0;i<N;i++){const t=i/(N-1);curveIn[i]=Math.sin(t*Math.PI/2);curveOut[i]=Math.cos(t*Math.PI/2);}

 // Seamless looper: two overlapping voices crossfade (equal-power) at the loop point.
 // Timing uses the AudioContext clock (not the game's frame dt), so a slow frame can never
 // let a voice run out of audio before the next one has faded in -> no more disappearing sound.
 class Looper{
  constructor(buffer,out){
   this.b=buffer;this.out=out;this.voices=[];this.running=false;this.rate=1;this.lastT=0;
   this.xf=Math.min(AUDIO_CFG.LOOP_XFADE,buffer.duration*0.4);

  spawn(fadeIn){
   const s=ctx.createBufferSource(),g=ctx.createGain();
   s.buffer=this.b;s.playbackRate.value=this.rate;

   s.connect(g);g.connect(this.out);

   s.onended=()=>{const i=this.voices.indexOf(v);if(i>=0)this.voices.splice(i,1);try{g.disconnect();}catch(_){}};

   }
   if(!this.voices.length)this.spawn(false); // safety net: never allow silence while running
  }

   for(const v of this.voices){try{v.s.stop(now+0.06);}catch(_){}}

 // Rev-style gas engine (ONE voice at a time -> no more stacked / overlapping layers):
 //  - quick tap  -> only the beginning of carsoundgas.mp3 plays at moderate volume, then fades smoothly
 //  - hold gas   -> the sample climbs to its END section, then that section loops with a crossfade
 //  - release    -> smooth exponential fade-out of the SAME voice; pressing again before it has
 //                  faded simply brings that voice back up (it is never duplicated)
 class GasLoop{
  constructor(buffer,out){
   this.b=buffer;this.out=out;this.voices=[];this.cur=null;this.rev=0;this.lastT=ctx.currentTime;
   const D=buffer.duration;
   this.S=Math.min(AUDIO_CFG.GAS_SUSTAIN_LEN,D*0.45);
   this.rampLen=Math.max(0.05,D-this.S);
   this.xf=Math.max(0.05,Math.min(AUDIO_CFG.LOOP_XFADE,this.S*0.45));
  }
  spawn(offset,level,fadeIn){
   const s=ctx.createBufferSource(),g=ctx.createGain();
   s.buffer=this.b;g.gain.value=0;s.connect(g);g.connect(this.out);
   const v={s,g,pos:offset,level,inT:0,inDur:fadeIn,xfading:false,xfT:0};
   s.onended=()=>{const i=this.voices.indexOf(v);if(i>=0)this.voices.splice(i,1);if(this.cur===v)this.cur=null;try{g.disconnect();}catch(_){}};
   s.start(0,Math.min(offset,this.b.duration-0.01));
   this.voices.push(v);

  }
  kill(v){try{v.s.stop();}catch(_){}const i=this.voices.indexOf(v);if(i>=0)this.voices.splice(i,1);if(this.cur===v)this.cur=null;try{v.g.disconnect();}catch(_){}}

   const now=ctx.currentTime,D=this.b.duration;
   const dt=Math.min(0.25,Math.max(0,now-this.lastT));this.lastT=now;
   if(holding&&!this.cur){

   }
   const target=holding?1:0;
   const k=holding?1/AUDIO_CFG.GAS_ATTACK_TAU:1/AUDIO_CFG.GAS_RELEASE_TAU;
   for(const v of this.voices.slice()){
    v.s.playbackRate.setTargetAtTime(rate,now,0.04);
    v.pos+=dt*rate;
    v.level+=(target-v.level)*(1-Math.exp(-k*dt));
    if(v===this.cur&&!v.xfading&&(D-v.pos)/Math.max(.3,rate)<=this.xf){
     v.xfading=true;v.xfT=0;
     this.cur=this.spawn(D-this.S,v.level,this.xf);   // child inherits the same level -> seamless

    if(v.inDur>0&&v.inT<v.inDur){v.inT+=dt;gain*=Math.sin(Math.PI/2*Math.min(1,v.inT/v.inDur));}
    if(v.xfading){v.xfT+=dt;gain*=Math.cos(Math.PI/2*Math.min(1,v.xfT/this.xf));}
    v.g.gain.setTargetAtTime(gain,now,0.012);
    if(v.xfading&&v.xfT>=this.xf){this.kill(v);continue;}
    if(!holding&&v.level<0.004){this.kill(v);}
   }
   if(holding&&this.cur)this.rev=Math.max(0,Math.min(1,this.cur.pos/this.rampLen));
   else this.rev=Math.max(0,this.rev-dt/AUDIO_CFG.REV_FALL_TIME);
   const r=this.rev,lv=0.55+0.45*(r*r*(3-2*r));   // short tap = medium volume, long hold = full
