 // Measures how loud a file really is (gated RMS) and returns the gain that brings it to the target level.
 function normGain(b,k){
  try{
   const d=b.getChannelData(0);let sum=0,n=0,peak=0;
   for(let i=0;i<d.length;i+=3){const x=Math.abs(d[i]);if(x>peak)peak=x;if(x>0.003){sum+=x*x;n++;}}
   if(!n||peak<=0)return 1;
   const rms=Math.sqrt(sum/n);
   let g=AUDIO_CFG.NORM_RMS[k]/rms;
   g=Math.min(g,AUDIO_CFG.NORM_MAX_GAIN,3/peak);   // never push peaks into hard clipping
   g=Math.max(0.2,g);
   console.log('Audio normalised',k,'rms',rms.toFixed(4),'peak',peak.toFixed(3),'gain x'+g.toFixed(2));
   return g;
  }catch(e){return 1;}
 }

   v.g.gain.cancelScheduledValues(now);
   v.g.gain.setValueAtTime(v.g.gain.value,now);
   v.g.gain.linearRampToValueAtTime(0,now+fade);
   v.s.stop(now+fade+0.02);
  }catch(_){}
 }

 function update(dt,gas,prox,brake){
  if(!ctx||!ready)return;
  const now=ctx.currentTime;
  const spd=Math.abs(speed);
  const spdRatio=clamp01(spd/CONFIG.MAX_SPEED);

  // ---- hard brake sound: ONE sound per brake press (70–209 KM/H) ----
  // Latch: once the sound has started it can NOT start again while the brake is still held.
  // It re-arms only after the brake pedal has really been released (small debounce so a
  // touch flicker / pointer re-capture can never double the sound).
  {
   const kmh=spd*3.6;
   const pressed=!!brake&&!gas&&prox>0.5;
   if(pressed)brakeIdleT=0;else brakeIdleT+=dt;
   if(brakeIdleT>=AUDIO_CFG.BRAKE_REARM_DELAY)brakeLatched=false;
   brakeCool-=dt;
   if(pressed&&!brakeLatched&&brakeCool<=0&&speed>1&&kmh>=AUDIO_CFG.BRAKE_MIN_KMH&&kmh<=AUDIO_CFG.BRAKE_MAX_KMH+1){
    startBrake(kmh);
    brakeLatched=true;brakeCool=0.25;
   }
   // fade out only when the pedal is truly released, or the car is almost stopped
   if(brakeVoice&&((brakeIdleT>=AUDIO_CFG.BRAKE_REARM_DELAY)||kmh<AUDIO_CFG.BRAKE_STOP_KMH))stopBrake(AUDIO_CFG.BRAKE_RELEASE);
   bus.brake.gain.setTargetAtTime(AUDIO_CFG.BRAKE_VOL*(0.85+0.15*clamp01(kmh/120)),now,0.05);
  }


  // ---- ambient (always, slow fade-in) ----
  if(ambLoop){
   ambLevel=lerpK(ambLevel,AUDIO_CFG.AMBIENT_VOL,AUDIO_CFG.AMBIENT_FADE,dt);
   bus.ambient.gain.setTargetAtTime(ambLevel,now,0.05);
   ambLoop.update(dt,1);
  }

  // ---- engine pitch follows speed; falls slowly after gas release ----
  let targetRate=AUDIO_CFG.RATE_MIN+(AUDIO_CFG.RATE_MAX-AUDIO_CFG.RATE_MIN)*Math.pow(spdRatio,.8);
  if(gas)targetRate+=0.06; else targetRate=AUDIO_CFG.RATE_MIN+(targetRate-AUDIO_CFG.RATE_MIN)*0.8;
  rate=lerpK(rate,targetRate,AUDIO_CFG.RATE_SMOOTH,dt);

  // ---- gas / rev loop ----
  if(gasLoop)gasLoop.update(rate,gas&&prox>0.5);

  // ---- idle loop (car stopped / not on throttle) ----
  if(idleLoop){
   // Real-car throttle behaviour: gas released -> engine idles (always, even while rolling);
   // gas pressed -> idle fades out and the rev sound takes over.
   const throttle=(gas&&prox>0.5);
   const target=throttle?0:AUDIO_CFG.IDLE_VOL*prox*(brakeVoice?0.4:1);   // idle ducks under the skid sound
   const k=target>idleLevel?AUDIO_CFG.IDLE_RISE:AUDIO_CFG.IDLE_FALL;
   idleLevel=lerpK(idleLevel,target,k,dt);
   bus.idle.gain.setTargetAtTime(idleLevel,now,0.05);
   idleLoop.update(dt,1+0.1*spdRatio);   // idle pitch rises slightly with road speed (engine braking feel)
  }
 }
 function setPaused(p){
  if(!ctx)return;
  try{if(p)ctx.suspend?.();else ctx.resume?.();}catch(_){}
 }
 return{unlock,update,setPaused};
})();

// ============================================================
//  TOP-SPEED FIRE – realistic glowing exhaust + rear-wheel flames
//  Appears the moment the speedometer reaches 207–209 KM/H and
//  disappears immediately when speed drops to 206 KM/H or lower.
//  Same spawn positions as the smoke (exhaust pipes + rear wheels).
//  Procedural noise-driven flame tongues (white-hot core -> yellow -> orange -> red),
//  flying embers/sparks, soft glow halos, a flickering real light that lights the
//  road + car, and extra bloom so the fire really glows.
// ============================================================
const FIRE_CFG={
 ON_KMH:207,            // fire ON  at 207 KM/H and above (max speed is ~209)
                        // fire OFF at 206 KM/H and below (instant)
 RISE:10,               // how fast the fire ignites (higher = faster)
 FALL:16,               // how fast the fire disappears below 207 (higher = more instant)
 FLAME_RATE:300,        // exhaust flame tongues per second
 CORE_RATE:150,         // white-hot jet cores per second
 WHEEL_RATE:110,        // rear-wheel flames per second
 EMBER_RATE:110,        // flying sparks per second
 GLOW_RATE:112,          // soft glow halos per second
 LIGHT_INTENSITY:5,    // real light cast on the road / car (was 46 – too bright)
 LIGHT_DISTANCE:20,
 BLOOM_BOOST:0.5,      // extra bloom while the fire is on (was 0.6 – too bright)
 BRIGHTNESS:0.1,        // overall fire colour brightness (lower = less glare)
 GLOW:0.6               // strength of the soft glow halos (lower = less glow)
};
const FIRE=(()=>{
 const N=COARSE?520:760;
 const S=COARSE?0.7:1;
 const F=()=>new Float32Array(N);
 const lx=F(),ly=F(),lz=F(),vx=F(),vy=F(),vz=F();
 const age=F().fill(1e9),life=F().fill(1),s0=F(),s1=F(),kind=F(),seed=F(),inten=F(),drag=F(),buoy=F();
 const aPos=new THREE.InstancedBufferAttribute(new Float32Array(N*3),3);
 const aVel=new THREE.InstancedBufferAttribute(new Float32Array(N*3),3);
 const aData=new THREE.InstancedBufferAttribute(new Float32Array(N*4),4);
 const aSeed=new THREE.InstancedBufferAttribute(new Float32Array(N*2),2);
 [aPos,aVel,aData,aSeed].forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
 const base=new THREE.PlaneGeometry(1,1);
 const geo=new THREE.InstancedBufferGeometry();
 geo.index=base.index;
 geo.setAttribute('position',base.attributes.position);
 geo.setAttribute('uv',base.attributes.uv);
 geo.setAttribute('aPos',aPos);geo.setAttribute('aVel',aVel);
 geo.setAttribute('aData',aData);geo.setAttribute('aSeed',aSeed);
 geo.instanceCount=N;

 const mat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uI:{value:0},uBright:{value:FIRE_CFG.BRIGHTNESS},uGlow:{value:FIRE_CFG.GLOW}},
  transparent:true,depthWrite:false,depthTest:true,
  blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  vertexShader:`
   attribute vec3 aPos;attribute vec3 aVel;attribute vec4 aData;attribute vec2 aSeed;
   varying vec2 vUv;varying vec4 vD;varying vec2 vS;
   void main(){
    vUv=uv;vD=aData;vS=aSeed;
    float size=aData.x,kind=aSeed.y;
    if(size<=0.0){gl_Position=vec4(2.0,2.0,2.0,1.0);return;}
    vec4 mv=viewMatrix*vec4(aPos,1.0);
    // flames are pushed upward by heat, so the tongue always licks upward on screen
    vec3 ve=aVel+vec3(0.0,kind<0.5?4.5:0.0,0.0);
    vec2 vv=(viewMatrix*vec4(ve,0.0)).xy;
    float vl=length(vv);
    vec2 dir=vl>0.001?vv/vl:vec2(0.0,1.0);
    vec2 perp=vec2(-dir.y,dir.x);
    vec2 q;
    if(kind<0.5){q=vec2((position.x+0.5)*size*2.1,position.y*size);}       // tongue: head at the nozzle
    else if(kind<1.5){q=vec2(position.x*size*(1.0+min(vl*0.25,6.0)),position.y*size);} // spark streak
    else{q=position.xy*size;}                                              // round glow
    mv.xy+=dir*q.x+perp*q.y;
    gl_Position=projectionMatrix*mv;
   }`,
  fragmentShader:`
   uniform float uTime,uI,uBright,uGlow;
   varying vec2 vUv;varying vec4 vD;varying vec2 vS;
   float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
   float vnoise(vec2 p){
    vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);
   }
   float fbm(vec2 p){return vnoise(p)*0.55+vnoise(p*2.1+7.3)*0.3+vnoise(p*4.3+3.1)*0.15;}
   vec3 fireRamp(float t){
    vec3 c=mix(vec3(0.06,0.0,0.0),vec3(0.85,0.10,0.0),smoothstep(0.0,0.30,t));
    c=mix(c,vec3(1.0,0.46,0.04),smoothstep(0.25,0.60,t));
    c=mix(c,vec3(1.0,0.82,0.30),smoothstep(0.55,0.88,t));
    c=mix(c,vec3(1.0,0.97,0.86),smoothstep(0.86,1.15,t));
    return c;
   }
   void main(){
    float life=vD.y,inten=vD.z,kind=vS.y,seed=vS.x;
    if(kind<0.5){
     // ---- flame tongue ----
     float a=vUv.x,c=(vUv.y-0.5)*2.0;
     float w=pow(max(sin(3.14159*pow(a,0.6)),0.0),0.8)*(1.0-0.35*a)+0.02;
     vec2 np=vec2(a*2.6-uTime*6.0+seed*31.0,c*1.7+seed*17.0);
     float n=fbm(np);
     float d=abs(c)/w+(n-0.5)*0.95*a;
     float body=1.0-smoothstep(0.35,1.0,d);
     body*=smoothstep(1.0,0.80,a);
     float heat=body*(1.18-a*0.78)*(1.0-life*0.72)*(0.72+0.55*n);
     vec3 col=fireRamp(heat);
     float fade=smoothstep(0.0,0.05,life)*(1.0-smoothstep(0.5,1.0,life))*uI*inten;
     float al=clamp(heat*1.7,0.0,1.0)*fade;
     if(al<0.003)discard;
     gl_FragColor=vec4(col*(1.2+heat*1.4)*uBright,al);
    }else if(kind<1.5){
     // ---- flying ember / spark ----
     vec2 p=(vUv-0.5)*2.0;
     float g=exp(-p.y*p.y*10.0)*exp(-p.x*p.x*1.7);
     float fl=0.65+0.35*sin(uTime*45.0+seed*60.0);
     float fade=(1.0-smoothstep(0.5,1.0,life))*uI*inten;
     float al=g*fade;
     if(al<0.004)discard;
     gl_FragColor=vec4(mix(vec3(1.0,0.42,0.08),vec3(1.0,0.88,0.55),g)*(2.0*fl*uBright),al);
    }else{
     // ---- soft glow halo ----
     vec2 p=(vUv-0.5)*2.0;
     float r=length(p);
     float g=exp(-r*r*3.4)*(1.0-smoothstep(0.8,1.0,r));
     float fl=0.78+0.22*sin(uTime*47.0+seed*40.0);
     float fade=smoothstep(0.0,0.12,life)*(1.0-smoothstep(0.35,1.0,life))*uI*inten;
     float al=g*0.6*uGlow*fade;
     if(al<0.004)discard;
     gl_FragColor=vec4(vec3(1.0,0.36,0.05)*fl*1.2*uBright,al);
    }
   }`
 });
 const mesh=new THREE.Mesh(geo,mat);
 mesh.frustumCulled=false;mesh.renderOrder=7;mesh.visible=false;scene.add(mesh);

 // Real light: lights up the road and the car body. Created now (intensity 0) so no shader hitch later.
 const light=new THREE.PointLight(0xff7a2a,0,FIRE_CFG.LIGHT_DISTANCE,1.8);
 scene.add(light);

 let head=0,I=0,live=false,hasPrev=false;
 const acc={f:0,c:0,w:0,e:0,g:0};
 const prev=new THREE.Vector3(),cur=new THREE.Vector3();
 const R=Math.random;
 const L=()=>CONFIG.CAR_LENGTH;
 const rear=()=>{
  let mz=0;wheelOffsets.forEach(v=>mz+=v.z);mz/=wheelOffsets.length;
  const r=wheelOffsets.filter(v=>v.z<mz);
  return r.length?r:[new THREE.Vector3(-.8,0,-1.4),new THREE.Vector3(.8,0,-1.4)];
 };

 // k: 0 flame tongue | 1 ember (world space) | 2 glow.  Kinds 0/2 live in the car's local frame (attached to the car).
 function spawn(k,px,py,pz,ax,ay,az,l,a0,a1,it,dr,bu,backAge){
  const i=head;head=(head+1)%N;
  kind[i]=k;lx[i]=px;ly[i]=py;lz[i]=pz;vx[i]=ax;vy[i]=ay;vz[i]=az;
  life[i]=l;age[i]=backAge||0;s0[i]=a0;s1[i]=a1;inten[i]=it;drag[i]=dr;buoy[i]=bu;seed[i]=R();
 }

 function update(dt){
  const kmh=Math.round(Math.abs(speed)*3.6);
  const on=kmh>=FIRE_CFG.ON_KMH&&vehicle.visible;
  I=on?Math.min(1,I+dt*FIRE_CFG.RISE):Math.max(0,I-dt*FIRE_CFG.FALL);

  if(!on&&I<=0.002){
   // fully out: wipe every particle so nothing lingers
   if(live){for(let i=0;i<N;i++){age[i]=1e9;}live=false;}
   I=0;mesh.visible=false;light.intensity=0;hasPrev=false;
   if(bloomPass)bloomPass.strength=CONFIG.BLOOM_STRENGTH;
   return;
  }
  live=true;mesh.visible=true;
  const now=performance.now()/1000;
  mat.uniforms.uTime.value=now%1000;
  mat.uniforms.uI.value=I;

  const h=heading,fx=Math.sin(h),fz=Math.cos(h),ch=Math.cos(h),sh=Math.sin(h);
  cur.copy(vehicle.position);
  if(!hasPrev||cur.distanceTo(prev)>8){prev.copy(cur);hasPrev=true;}
  const cvx=fx*speed,cvz=fz*speed;
  const Lh=L()*0.5;
  const XH=carExhaust();                       // BMW: ONE left pipe | null = green buggy (twin pipes, unchanged)

  if(on){
   acc.f+=FIRE_CFG.FLAME_RATE*S*dt;acc.c+=FIRE_CFG.CORE_RATE*S*dt;
   acc.w+=FIRE_CFG.WHEEL_RATE*S*dt;acc.e+=FIRE_CFG.EMBER_RATE*S*dt;acc.g+=FIRE_CFG.GLOW_RATE*S*dt;
   const rr=rear();
   let guard=0;
   while(acc.f>=1&&guard++<60){acc.f-=1;                // exhaust flame tongue
    const side=XH?(XH.x<0?-1:1):(R()<.5?-1:1);
    const ex0=XH?XH.x:side*0.45,ey0=XH?XH.y:0.33,ez0=XH?XH.z:-Lh;
    spawn(0,ex0+(R()-.5)*0.08,ey0+(R()-.5)*0.08,ez0-0.02,
     side*(0.15+R()*0.5)+(R()-.5)*0.8,0.3+R()*0.9,-(6.5+R()*6.5),
     0.26+R()*0.22,0.2+R()*0.1,0.5+R()*0.3,1.0,2.4,2.2,R()*dt);}
   while(acc.c>=1&&guard++<100){acc.c-=1;               // white-hot jet core
    const side=XH?(XH.x<0?-1:1):(R()<.5?-1:1);
    const ex0=XH?XH.x:side*0.45,ey0=XH?XH.y:0.33,ez0=XH?XH.z:-Lh;
    spawn(0,ex0,ey0+(R()-.5)*0.05,ez0-0.02,
     (R()-.5)*0.5,0.2+R()*0.5,-(4+R()*4),
     0.12+R()*0.1,0.12+R()*0.05,0.3+R()*0.1,1.5,3.0,1.0,R()*dt);}
   while(acc.w>=1&&guard++<140){acc.w-=1;               // rear wheel flame (same spots as tire smoke)
    const o=rr[(R()*rr.length)|0];
    spawn(0,o.x+(R()-.5)*0.2,0.1+R()*0.1,o.z-0.1+(R()-.5)*0.3,
     (R()-.5)*1.4,0.5+R()*1.2,-(2.5+R()*3.5),
     0.2+R()*0.2,0.16,0.45+R()*0.15,0.65,2.0,2.5,R()*dt);}
   while(acc.g>=1&&guard++<180){acc.g-=1;               // glow halos
    const side=XH?(XH.x<0?-1:1):(R()<.5?-1:1);
    const ex0=XH?XH.x:side*0.45,ey0=XH?XH.y:0.33,ez0=XH?XH.z:-Lh;
    spawn(2,ex0,ey0+0.07,ez0-0.25,0,0,-1.5,
     0.12+R()*0.08,1.0,1.7,0.7,1.0,0,R()*dt);
    if(R()<0.12)spawn(2,XH?XH.x:0,XH?XH.y+0.12:0.45,ez0-0.6,0,0,-1.0,0.16,1.4,2.0,0.4,1.0,0,R()*dt);}
   while(acc.e>=1&&guard++<240){acc.e-=1;               // flying sparks (world space, trail behind)
    const t=R();
    const bx=prev.x+(cur.x-prev.x)*t,by=prev.y+(cur.y-prev.y)*t,bz=prev.z+(cur.z-prev.z)*t;
    const ox=XH?XH.x:(R()<.5?-0.45:0.45),oz=XH?XH.z:-Lh;
    const lvx=(R()-.5)*5,lvy=1.2+R()*3.2,lvz=-(3+R()*9);
    spawn(1,bx+ox*ch+oz*sh,by+(XH?XH.y:0.35),bz-ox*sh+oz*ch,
     cvx*0.97+(lvx*ch+lvz*sh),lvy,cvz*0.97+(-lvx*sh+lvz*ch),
     0.5+R()*0.7,0.05+R()*0.04,0.035,1.0,0.5,-9,(1-t)*dt);}
  }
  prev.copy(cur);

  const P=aPos.array,V=aVel.array,D=aData.array,Sd=aSeed.array;
  const gy=cur.y-0.12;
  for(let i=0;i<N;i++){
   if(age[i]>=life[i]){D[i*4]=0;continue;}
   age[i]+=dt;
   if(age[i]>=life[i]){D[i*4]=0;continue;}
   const l=age[i]/life[i],e=1-(1-l)*(1-l);
   const dk=Math.exp(-drag[i]*dt);
   let wx,wy,wz,rx,ry,rz;
   if(kind[i]===1){
    // world-space spark: gravity + drag, bounces on the road
    vx[i]*=dk;vz[i]*=dk;vy[i]=vy[i]*dk+buoy[i]*dt;
    lx[i]+=vx[i]*dt;ly[i]+=vy[i]*dt;lz[i]+=vz[i]*dt;
    if(ly[i]<gy&&vy[i]<0){ly[i]=gy;vy[i]*=-0.35;}
    wx=lx[i];wy=ly[i];wz=lz[i];
    rx=vx[i]-cvx;ry=vy[i];rz=vz[i]-cvz;
   }else{
    // attached to the car: local frame rotates with the car
    const tt=now*14+seed[i]*30;
    vx[i]=vx[i]*dk+Math.sin(tt)*3.2*dt*(kind[i]===0?1:0);
    vy[i]=vy[i]*dk+buoy[i]*dt;
    vz[i]*=dk;
    lx[i]+=vx[i]*dt;ly[i]+=vy[i]*dt;lz[i]+=vz[i]*dt;
    wx=cur.x+lx[i]*ch+lz[i]*sh;wy=cur.y+ly[i];wz=cur.z-lx[i]*sh+lz[i]*ch;
    rx=vx[i]*ch+vz[i]*sh;ry=vy[i];rz=-vx[i]*sh+vz[i]*ch;
   }
   P[i*3]=wx;P[i*3+1]=wy;P[i*3+2]=wz;
   V[i*3]=rx;V[i*3+1]=ry;V[i*3+2]=rz;
   D[i*4]=s0[i]+(s1[i]-s0[i])*e;D[i*4+1]=l;D[i*4+2]=inten[i];D[i*4+3]=0;
   Sd[i*2]=seed[i];Sd[i*2+1]=kind[i];
  }
  aPos.needsUpdate=true;aVel.needsUpdate=true;aData.needsUpdate=true;aSeed.needsUpdate=true;

  // flickering light at the exhaust
  const fl=0.78+0.22*Math.sin(now*37)+0.14*Math.sin(now*71.3)+0.08*Math.sin(now*113);
  const lxL=XH?XH.x:0,lzL=(XH?XH.z:-Lh)-0.5;
  light.position.set(cur.x+lxL*ch+lzL*sh,cur.y+0.5,cur.z-lxL*sh+lzL*ch);
  light.intensity=FIRE_CFG.LIGHT_INTENSITY*I*Math.max(0.3,fl);
  if(bloomPass)bloomPass.strength=CONFIG.BLOOM_STRENGTH+FIRE_CFG.BLOOM_BOOST*I;
 }
 return{update};
})();

// ============================================================
//  PAUSE SYSTEM – PAUSE button (top center) → blurred pause screen with RESUME / EXIT.
//  EXIT = back to Screen 1 (menu) with a fresh game until PLAY is pressed again.
// ============================================================
let gamePaused=false,pausedFrames=0;
const pauseBtnEl=document.getElementById('pauseBtn');
const pauseScreenEl=document.getElementById('pauseScreen');
function releaseAllInputs(){
 input.gas=input.brake=input.left=input.right=false;
 Object.keys(keys).forEach(k=>{keys[k]=false;});
 Object.keys(playerKeys).forEach(k=>{playerKeys[k]=false;});
 jumpQueued=false;
 ['left','right','gas','brake'].forEach(id=>{try{ctrlSet(id,false);}catch(_){}});
}
function pauseGame(){
 if(!gameStarted||gamePaused)return;
 gamePaused=true;
 pausedFrames=12;                       // keep drawing a few frames so the blurred backdrop is always up to date
 releaseAllInputs();
 pauseScreenEl.classList.add('show');
 pauseScreenEl.setAttribute('aria-hidden','false');
 try{CAR_AUDIO.setPaused(true);}catch(_){}
 try{rainAudio?.ctx.suspend?.();}catch(_){}
}
function resumeGame(){
 if(!gamePaused)return;
 gamePaused=false;
 pauseScreenEl.classList.remove('show');
 pauseScreenEl.setAttribute('aria-hidden','true');
 try{CAR_AUDIO.setPaused(false);}catch(_){}
 try{rainAudio?.ctx.resume?.();}catch(_){}
}
function exitToMenu(){
 if(!gameStarted)return;
 gamePaused=false;
 pauseScreenEl.classList.remove('show');
 pauseScreenEl.setAttribute('aria-hidden','true');
 pauseBtnEl.classList.remove('show');
 gameStarted=false;                     // animate() goes back to the "waiting for PLAY" state
 releaseAllInputs();
 // fresh start for the next PLAY
 try{
 speed=0;verticalVelocity=0;steer=0;bodyPitch=0;bodyRoll=0;heading=Math.PI/2;
 resetVehicle();
 camera.position.set(vehicle.position.x-10,vehicle.position.y+6,vehicle.position.z);
 cameraLook.set(0,0,0);
 orbit.yaw=0;orbit.pitch=0;orbit.dragging=false;
 wig.energy=0;wig.yaw=0;wig.roll=0;wig.pitch=0;
 }catch(err){console.warn('Reset on exit:',err);}
 try{TIREMARKS.clear();}catch(_){}
 try{                                    // stop rain / thunder so Screen 1 is calm
  weather.active=false;weather.timer=0;weather.flashAt=-1;weather.flashT=-1;weather.thunderIn=-1;
  weather.rain=0;weather.wet=0;weather.next=RAIN_CFG.FIRST_DELAY;
  updateWeather(0);
 }catch(_){}
 try{document.querySelector('#speed').innerHTML='0<small>KM/H</small>';}catch(_){}
 try{CAR_AUDIO.setPaused(false);}catch(_){}
 try{rainAudio?.ctx.resume?.();}catch(_){}
 showMenuScreen();
}

// RESUME / EXIT: smooth press animation (squash + ripple + pop), action fires on release (pointer) or click (keyboard/fallback)
function bindPauseOpt(id,action){
 const el=document.getElementById(id);
 let firedAt=-1e9;
 const fire=()=>{
  const t=performance.now();
  if(t-firedAt<600)return;              // pointerup + click would otherwise fire twice
  firedAt=t;
  el.classList.remove('pressed');
  el.classList.add('chosen');
  setTimeout(()=>{el.classList.remove('chosen');action();},170);
 };
 el.addEventListener('pointerdown',e=>{
  e.stopPropagation();
  el.classList.add('pressed');
  const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.7;
  const rp=document.createElement('i');rp.className='ripple';
  rp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  el.appendChild(rp);setTimeout(()=>rp.remove(),650);
 });
 el.addEventListener('pointerup',e=>{
  e.stopPropagation();
  el.classList.remove('pressed');
  const r=el.getBoundingClientRect();
  if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)fire();
 });
 ['pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('pressed')));
 el.addEventListener('click',e=>{e.stopPropagation();fire();});
}
bindPauseOpt('resumeBtn',resumeGame);
bindPauseOpt('exitBtn',exitToMenu);
bindPauseOpt('garageBtn',()=>openGarage());
// the pause screen swallows pointer/mouse events so nothing underneath (orbit camera, audio unlock...) reacts.
// NOTE: touchstart/touchend/mouseup are NEVER preventDefault-ed here, otherwise the browser cancels the tap ("click") on phones.
['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend','mousedown','mouseup','wheel','contextmenu'].forEach(t=>{
 pauseScreenEl.addEventListener(t,e=>{
  e.stopPropagation();
  if((t==='wheel'||t==='contextmenu'||t==='touchmove')&&e.cancelable)e.preventDefault();
 },{passive:false});
});
// keyboard: P / Esc toggles pause; all other keys are ignored while paused (capture phase = runs before every other key handler)
addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase();
 if(garage.open){                       // Screen 3 is open: Esc/P = back, arrows = browse, Enter = select
  if(!e.repeat){
   if(k==='escape'||k==='p')closeGarage();
   else if(k==='arrowleft'||k==='a')garageStep(-1);
   else if(k==='arrowright'||k==='d')garageStep(1);
   else if(k==='enter')garageSelect();
  }
  e.stopImmediatePropagation();e.preventDefault();
  return;
 }
 if(k==='p'||k==='escape'){
  if(!e.repeat){if(gamePaused)resumeGame();else if(gameStarted)pauseGame();}
  if(gamePaused||gameStarted)e.stopImmediatePropagation();
  return;
 }
 if(gamePaused)e.stopImmediatePropagation();
},true);
// when the tab comes back, keep audio suspended if the game is still paused
document.addEventListener('visibilitychange',()=>{
 if(gamePaused&&!document.hidden){try{CAR_AUDIO.setPaused(true);}catch(_){}try{rainAudio?.ctx.suspend?.();}catch(_){}}
});
// repaint the frozen frame if the window is resized while paused
['resize','orientationchange'].forEach(t=>addEventListener(t,()=>{if(gamePaused)pausedFrames=12;},{passive:true}));

// ---------- helper: copy only some triangles of a geometry into a new geometry ----------
function subGeometry(g,tris){
 const idx=g.index||null;
 const names=Object.keys(g.attributes);
 const map=new Map(),out={},ni=[];
 names.forEach(n=>{out[n]=[];});
 for(const t of tris){
  for(let k=0;k<3;k++){
   const vi=idx?idx.getX(t*3+k):t*3+k;
   let n=map.get(vi);
   if(n===undefined){
    n=map.size;map.set(vi,n);
    names.forEach(nm=>{
     const a=g.attributes[nm];
     for(let c=0;c<a.itemSize;c++)out[nm].push(c===0?a.getX(vi):c===1?a.getY(vi):c===2?a.getZ(vi):a.getW(vi));
    });
   }
   ni.push(n);
  }
 }
 const ng=new THREE.BufferGeometry();
 names.forEach(nm=>{const a=g.attributes[nm];ng.setAttribute(nm,new THREE.BufferAttribute(new Float32Array(out[nm]),a.itemSize));});
 ng.setIndex(ni);
 return ng;
}

// ---------- BMW paint / glass / tyre tuning so the colours look right inside the game lighting ----------
function tuneBmwMaterial(m){
 if(!m||!(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial))return;
 const nm=m.name||'';
 m.userData=m.userData||{};
 m.userData.noMenuTune=true;
 m.envMapIntensity=1.1;
 if(m.transparent){                                   // windows, lamps
  m.depthWrite=false;
  m.metalness=Math.min(m.metalness??0,0.1);
  m.roughness=Math.min(m.roughness??0.2,0.2);
  m.envMapIntensity=1.4;
 }else if(nm==='Mat.7'){                              // tyres
  m.metalness=0.05;m.roughness=0.82;m.envMapIntensity=0.35;
 }else if(nm==='Mat.8'||nm==='Mat.8_0'){              // brake discs / calipers
  m.metalness=0.45;m.roughness=0.38;
 }else if(nm==='Mat.3'){                              // main livery (white / green / red) – keep true colours
  m.metalness=0.12;m.roughness=0.32;m.envMapIntensity=1.0;
 }else if(m.map){
  m.metalness=Math.min(m.metalness??0,0.35);
 }else{
  m.metalness=Math.min(m.metalness??0,0.75);
 }
 m.needsUpdate=true;
}

// ---------- build the BMW: same length as the green buggy, nose = +Z, axle = X, wheels split so they spin ----------
function buildBmwCar(gltf){
 const d=CAR_DEFS.bmw;
 const src=gltf.scene;src.updateMatrixWorld(true);
 const Ry=new THREE.Matrix4().makeRotationY(Math.PI/2);       // model nose (-X) -> game forward (+Z)
 const parts=[];
 src.traverse(o=>{
  if(!o.isMesh||!o.geometry)return;
  const g=o.geometry.clone();
  g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(Ry,o.matrixWorld));
  parts.push({g,m:Array.isArray(o.material)?o.material[0]:o.material});
 });
 if(!parts.length)throw new Error('BMW model has no meshes');

 // same size as the green buggy (CONFIG.CAR_LENGTH), centred, tyres touching y = 0
 const box=new THREE.Box3();
 parts.forEach(p=>{p.g.computeBoundingBox();box.union(p.g.boundingBox);});
 const size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
 const sc=CONFIG.CAR_LENGTH*(d.sizeBoost||1)/Math.max(size.x,size.z);
 parts.forEach(p=>{p.g.translate(-ctr.x,-box.min.y,-ctr.z);p.g.scale(sc,sc,sc);p.g.computeBoundingBox();});

 const root=new THREE.Group();root.name='BMW_E36_RACING';
 const isWheel=p=>/^Mat\.(7|8|8_0)$/.test((p.m&&p.m.name)||'');
 const wheelParts=parts.filter(isWheel);

 // split tyres/brakes into FL, FR, RL, RR (same order the game expects: -x+z, +x+z, -x-z, +x-z)
 const wheels=[],offsets=[];let radius=0;
 if(wheelParts.length){
  const wb=new THREE.Box3();wheelParts.forEach(p=>wb.union(p.g.boundingBox));
  const zmid=(wb.min.z+wb.max.z)/2;
  const quads=[[],[],[],[]];
  wheelParts.forEach(p=>{
   const pos=p.g.attributes.position,idx=p.g.index;
   const n=(idx?idx.count:pos.count)/3;
   const buckets=[[],[],[],[]];
   for(let t=0;t<n;t++){
    let cx=0,cz=0;
    for(let k=0;k<3;k++){const vi=idx?idx.getX(t*3+k):t*3+k;cx+=pos.getX(vi);cz+=pos.getZ(vi);}
    cx/=3;cz/=3;
    buckets[(cz>zmid?0:2)+(cx<0?0:1)].push(t);
   }
   buckets.forEach((b,q)=>{if(b.length)quads[q].push({g:subGeometry(p.g,b),m:p.m});});
  });
  const names=['FL','FR','RL','RR'];
  quads.forEach((list,q)=>{
   if(!list.length)return;
   const qb=new THREE.Box3();
   list.forEach(it=>{it.g.computeBoundingBox();qb.union(it.g.boundingBox);});
   const pivot=qb.getCenter(new THREE.Vector3());
   const w=new THREE.Group();w.name='Circle.'+names[q];      // 'Circle.' = same naming the game already uses for wheels
   w.position.copy(pivot);
   list.forEach(it=>{it.g.translate(-pivot.x,-pivot.y,-pivot.z);w.add(new THREE.Mesh(it.g,it.m));});
   root.add(w);wheels.push(w);
   offsets.push(new THREE.Vector3(pivot.x,0,pivot.z));
   radius+=(qb.max.y-qb.min.y)/2;
  });
  radius=wheels.length?radius/wheels.length:0;
 }
 parts.filter(p=>!isWheel(p)).forEach(p=>root.add(new THREE.Mesh(p.g,p.m)));

 const mats=new Set();
 root.traverse(o=>{
  if(!o.isMesh)return;
  o.castShadow=false;o.receiveShadow=true;o.frustumCulled=true;
  (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.add(m));
 });
 mats.forEach(tuneBmwMaterial);

 // BMW's real tail-pipe (left side of the car): model-space mouth (2.67, 0.37, 0.68) -> game frame
 d.exhaust={x:(0.68-ctr.x)*sc,y:(0.37-box.min.y)*sc,z:(-2.67-ctr.z)*sc};
 d.model=root;
 d.wheels=wheels;
 d.offsets=(offsets.length===4)?offsets:[new THREE.Vector3(-.88,0,1.38),new THREE.Vector3(.88,0,1.38),new THREE.Vector3(-.88,0,-1.38),new THREE.Vector3(.88,0,-1.38)];
 d.radius=radius>0?THREE.MathUtils.clamp(radius,.25,.55):.31;
 if(offsets.length!==4)d.wheels=[];
}

function loadBmwCar(){
 const d=CAR_DEFS.bmw;
 if(d.ready||d.loading)return Promise.resolve();
 d.loading=true;d.failed=false;
 try{refreshGarageUI();}catch(_){}
 return new Promise(resolve=>{
  loader.load(d.url,gltf=>{
   try{buildBmwCar(gltf);d.ready=true;}
   catch(err){console.error('BMW build failed',err);d.failed=true;}
   d.loading=false;
   try{refreshGarageUI();}catch(_){}
   resolve();
  },undefined,err=>{
   console.error('BMW GLB load failed ('+d.url+')',err);
   d.failed=true;d.loading=false;
   try{refreshGarageUI();}catch(_){}
   resolve();
  });
 });
}

// ---------- REAL-TIME CAR SWAP (works while the game is paused or running) ----------
function applyCar(id){
 const d=CAR_DEFS[id];
 if(!d||!d.ready||!d.model)return false;
 if(id===currentCarId&&carModel===d.model)return true;
 if(carModel&&carModel.parent)carModel.parent.remove(carModel);
 carModel=d.model;
 wheelObjects=d.wheels;
 wheelOffsets=d.offsets.map(v=>v.clone());
 wheelRadius=d.radius;
 vehicle.add(carModel);
 carModel.updateMatrixWorld(true);
 currentCarId=id;
 try{TIREMARKS.rebuild();TIREMARKS.clear();}catch(_){}
 try{                                  // wet-surface bookkeeping must follow the new car's materials
  if(weather.ready)applyWet(0);
  wetList.length=0;weather.ready=false;weather.lastWet=-1;
 }catch(_){}
 pausedFrames=12;                      // repaint the blurred background so the new car is visible behind the menu
 return true;
}

// ---------- 3D turntable (own renderer, like the Screen 1 menu) ----------
function initGarage3D(){
 if(garage.ready3d)return true;
 try{
  const r=new THREE.WebGLRenderer({canvas:gEl.canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  r.outputColorSpace=THREE.SRGBColorSpace;
  r.toneMapping=THREE.ACESFilmicToneMapping;
  r.toneMappingExposure=1.05;
  r.shadowMap.enabled=true;
  r.shadowMap.type=THREE.PCFSoftShadowMap;
  r.setClearColor(0x000000,0);
  const sc=new THREE.Scene();
  sc.background=null;
  if(scene.environment)sc.environment=scene.environment;   // same sky reflections as the game
  const cam=new THREE.PerspectiveCamera(34,1,.1,100);

  sc.add(new THREE.HemisphereLight(0xdfeaff,0x1a2230,0.55));
  // SPOTLIGHT from above
  const spot=new THREE.SpotLight(0xfff2de,420,0,Math.PI/6.2,0.55,1.7);
  spot.position.set(1.2,9.2,2.2);
  spot.target.position.set(0,0,0);
  spot.castShadow=true;
  spot.shadow.mapSize.set(1024,1024);
  spot.shadow.bias=-0.0004;spot.shadow.radius=4;
  sc.add(spot);sc.add(spot.target);
  const rimL=new THREE.DirectionalLight(0x6ea8ff,1.5);rimL.position.set(-6,3,-6);sc.add(rimL);
  const fillL=new THREE.DirectionalLight(0xffd9b0,0.9);fillL.position.set(6,2.5,5);sc.add(fillL);

  // floor + glowing ring (the "selector" platform)
  const floor=new THREE.Mesh(new THREE.CircleGeometry(3.7,64),new THREE.MeshStandardMaterial({color:0x151a21,roughness:0.38,metalness:0.55}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;sc.add(floor);
  const ring=new THREE.Mesh(new THREE.RingGeometry(3.42,3.58,96),new THREE.MeshBasicMaterial({color:0x4aa8ff,transparent:true,opacity:0.9,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.012;sc.add(ring);
  const ring2=new THREE.Mesh(new THREE.RingGeometry(2.55,2.6,96),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.22,side:THREE.DoubleSide}));
  ring2.rotation.x=-Math.PI/2;ring2.position.y=0.012;sc.add(ring2);
  // soft light cone
  const cone=new THREE.Mesh(new THREE.ConeGeometry(3.5,9,48,1,true),new THREE.ShaderMaterial({
   transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
   uniforms:{c:{value:new THREE.Color(0xfff0d0)}},
   vertexShader:'varying float vY;void main(){vY=position.y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
   fragmentShader:'uniform vec3 c;varying float vY;void main(){float t=clamp((vY+4.5)/9.0,0.0,1.0);gl_FragColor=vec4(c,0.075*t*t);}'
  }));
  cone.position.set(0,4.5,0);sc.add(cone);

  const turn=new THREE.Group();sc.add(turn);          // rotates (turntable)
  const holder=new THREE.Group();turn.add(holder);    // holds the current car (pop-in animation)

  garage.renderer=r;garage.scene=sc;garage.camera=cam;garage.turn=turn;garage.holder=holder;garage.spot=spot;
  garage.ready3d=true;
  return true;
 }catch(err){
  console.error('Garage 3D init failed',err);
  return false;
 }
}

function sizeGarage(){
 if(!garage.ready3d)return;
 garage.w=Math.max(1,gEl.screen.clientWidth||innerWidth);
 garage.h=Math.max(1,gEl.screen.clientHeight||innerHeight);
 garage.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 garage.renderer.setSize(garage.w,garage.h,false);
 const cam=garage.camera,aspect=garage.w/garage.h;
 cam.aspect=aspect;
 const t=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
 const dist=Math.max(8.6,(3.8)/(t*aspect));      // keep the whole car + platform in view on narrow screens too
 cam.position.set(0,dist*0.27,dist*0.96);
 cam.lookAt(0,0.55,0);
 cam.updateProjectionMatrix();
}

function garageCloneFor(id){
 if(garage.clones[id])return garage.clones[id];
 const d=CAR_DEFS[id];
 if(!d||!d.ready||!d.model)return null;
 const c=d.model.clone(true);
 c.traverse(o=>{
  if(!o.isMesh)return;
  const mats=Array.isArray(o.material)?o.material:[o.material];
  o.castShadow=!mats.some(m=>m&&m.transparent);   // solid parts cast a real spot-light shadow on the platform
  o.receiveShadow=false;
  o.frustumCulled=false;
 });
 const g=new THREE.Group();g.add(c);
 garage.clones[id]=g;
 return g;
}

function showGarageCar(){
 if(!garage.ready3d)return;
 const id=CAR_ORDER[garage.index];
 const g=garageCloneFor(id);
 if(garage.shown&&garage.shown.parent)garage.shown.parent.remove(garage.shown);
 garage.shown=g||null;
 if(g){garage.holder.add(g);garage.popT=0;}
}

function garageTick(now){
 if(!garage.open)return;
 garage.raf=requestAnimationFrame(garageTick);
 const dt=Math.min(.05,(now-garage.last)/1000||.016);
 garage.last=now;
 // late arrival of the BMW while the garage is open
 const id=CAR_ORDER[garage.index],d=CAR_DEFS[id];
 if(!garage.shown&&d.ready)showGarageCar();
 garage.turn.rotation.y+=dt*0.55;
 if(garage.shown){
  garage.popT=Math.min(1,garage.popT+dt/0.42);
  const k=garage.popT,e=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);   // easeOutBack
  garage.holder.scale.setScalar(Math.max(.001,e));
 }
 garage.renderer.render(garage.scene,garage.camera);
}

function openGarage(){
 if(!gamePaused||garage.open)return;
 garage.open=true;
 pauseScreenEl.classList.remove('show');
 pauseScreenEl.setAttribute('aria-hidden','true');
 gEl.screen.classList.add('show');
 gEl.screen.setAttribute('aria-hidden','false');
 const idx=CAR_ORDER.indexOf(currentCarId);
 garage.index=idx>=0?idx:0;
 garage.shown=null;
 initGarage3D();
 sizeGarage();
 if(CAR_DEFS.bmw&&!CAR_DEFS.bmw.ready&&!CAR_DEFS.bmw.loading)loadBmwCar();   // retry if it failed earlier
 refreshGarageUI();
 showGarageCar();
 garage.last=performance.now();
 if(garage.ready3d&&!garage.raf)garage.raf=requestAnimationFrame(garageTick);
}

function closeGarage(){
 if(!garage.open)return;
 garage.open=false;
 if(garage.raf){cancelAnimationFrame(garage.raf);garage.raf=0;}
 gEl.screen.classList.remove('show');
 gEl.screen.setAttribute('aria-hidden','true');
 gEl.toast.classList.remove('show');
 if(gamePaused){                       // back to the PAUSE menu
  pausedFrames=12;
  pauseScreenEl.classList.add('show');
  pauseScreenEl.setAttribute('aria-hidden','false');
 }
}

let last=performance.now();
const cameraLook=new THREE.Vector3();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.035);last=now;
 // PAUSED: freeze all game logic, physics, weather and audio updates; keep the last frame under the blurred pause screen
 if(gamePaused){
  if(pausedFrames>0){pausedFrames--;if(composer)composer.render();else renderer.render(scene,camera);}
  return;
 }
 // Wait for PLAY on menu screen before running game logic
 // keep audio alive on the menu too (ambient + idle loops stay in sync)
 CAR_AUDIO.update(dt,false,0);
 if(!gameStarted){
  if(composer)composer.render();
  else renderer.render(scene,camera);
  return;
 }
 if(playerMode && playerLoaded && mapRoot && carModel && colliders.length){
  updatePlayer(dt);
  updateWeather(dt);
  CAR_AUDIO.update(dt,false,Math.max(0,Math.min(1,1-playerRoot.position.distanceTo(vehicle.position)/AUDIO_CFG.ONFOOT_IDLE_RANGE))*0.7);
  FIRE.update(dt);
 }else if(mapRoot && carModel && colliders.length){
  const gas=input.gas||keys.w||keys.arrowup;
  const brake=input.brake||keys.s||keys.arrowdown;
  const left=input.left||keys.a||keys.arrowleft;
  const right=input.right||keys.d||keys.arrowright;
  if(gas)speed=Math.min(CONFIG.MAX_SPEED,speed+CONFIG.ACCELERATION*dt);
  else if(brake){
   if(speed>1)speed=Math.max(0,speed-CONFIG.BRAKE_POWER*dt);
   else speed=Math.max(-CONFIG.REVERSE_SPEED,speed-CONFIG.ACCELERATION*.48*dt);
  }else{
   speed=Math.abs(speed)<.15?0:speed-Math.sign(speed)*CONFIG.DRAG*dt;
  }
  const steerInput=(left?1:0)-(right?1:0);
  steer=THREE.MathUtils.damp(steer,steerInput,5.5,dt);
  if(Math.abs(speed)>.25){
   const speedFactor=.22+Math.min(1,Math.abs(speed)/CONFIG.MAX_SPEED)*.9;
   heading+=steer*CONFIG.STEER_RATE*speedFactor*dt*Math.sign(speed);
  }
  vehicle.rotation.y=heading;
  const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
  const oldPosition=vehicle.position.clone();
  vehicle.position.addScaledVector(forward,speed*dt);
  if(obstacleAhead()){
   vehicle.position.copy(oldPosition);
   speed*= -.12;
  }

  let frontY=0,rearY=0,leftY=0,rightY=0,count=0,frontN=0,rearN=0,leftN=0,rightN=0;
  const yawRotation=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),heading);
  const wheelContacts=[];
  for(let i=0;i<wheelOffsets.length;i++){
   const off=wheelOffsets[i];
   const flatOffset=off.clone();
   flatOffset.y=0;
   flatOffset.applyQuaternion(yawRotation);
   const wx=vehicle.position.x+flatOffset.x;
   const wz=vehicle.position.z+flatOffset.z;
   const hit=groundHit(wx,wz,vehicle.position.y+CONFIG.GROUND_RAY_START,CONFIG.GROUND_RAY_LENGTH);
   wheelContacts.push(hit);
   if(!hit)continue;
   count++;
   const isFront=off.z>0;
   const isLeft=off.x<0;
   if(isFront){frontY+=hit.point.y;frontN++}else{rearY+=hit.point.y;rearN++}
   if(isLeft){leftY+=hit.point.y;leftN++}else{rightY+=hit.point.y;rightN++}
  }

  if(count>=3){
   const avgGround=(frontY+rearY)/count;
   const targetY=avgGround+CONFIG.RIDE_HEIGHT;
   const heightError=targetY-vehicle.position.y;
   const springAcceleration=heightError*CONFIG.SPRING_STIFFNESS;
   const dampingAcceleration=-verticalVelocity*CONFIG.SUSPENSION_DAMPING;
   verticalVelocity+=(springAcceleration+dampingAcceleration)*dt;
   verticalVelocity=THREE.MathUtils.clamp(verticalVelocity,-5.5,5.5);
   vehicle.position.y+=verticalVelocity*dt;

   grounded=true;
   if(frontN&&rearN){
    const f=frontY/frontN,r=rearY/rearN;
    const wheelBase=Math.max(1.5,Math.abs(wheelOffsets[0].z-wheelOffsets[2].z));
    const slopePitch=-Math.atan2(f-r,wheelBase);
    bodyPitch=THREE.MathUtils.damp(bodyPitch,THREE.MathUtils.clamp(slopePitch,-.48,.48),12,dt);
   }
   if(leftN&&rightN){
    const l=leftY/leftN,rr=rightY/rightN;
    const trackWidth=Math.max(1.2,Math.abs(wheelOffsets[0].x-wheelOffsets[1].x));
    const slopeRoll=-Math.atan2(l-rr,trackWidth);
    bodyRoll=THREE.MathUtils.damp(bodyRoll,THREE.MathUtils.clamp(slopeRoll,-.32,.32),10,dt);
   }
  }else if(count>0){
   const supportedY=wheelContacts.filter(Boolean).reduce((sum,h)=>sum+h.point.y,0)/count;
   const targetY=supportedY+CONFIG.RIDE_HEIGHT;
   verticalVelocity+=(targetY-vehicle.position.y)*35*dt;
   verticalVelocity-=verticalVelocity*12*dt;
   verticalVelocity=THREE.MathUtils.clamp(verticalVelocity,-4,4);
   vehicle.position.y+=verticalVelocity*dt;
   bodyPitch=THREE.MathUtils.damp(bodyPitch,0,3,dt);
   bodyRoll=THREE.MathUtils.damp(bodyRoll,0,3,dt);
   grounded=true;
  }else{
   verticalVelocity-=CONFIG.GRAVITY*dt;
   verticalVelocity=THREE.MathUtils.clamp(verticalVelocity,-12,12);
   vehicle.position.y+=verticalVelocity*dt;
   bodyPitch=THREE.MathUtils.damp(bodyPitch,0,2,dt);
   bodyRoll=THREE.MathUtils.damp(bodyRoll,0,2,dt);
   grounded=false;
  }
  updateWiggle(dt);
  vehicle.rotation.set(bodyPitch+wig.pitch,heading+wig.yaw,bodyRoll+wig.roll,'YXZ');
  TIREMARKS.update(dt,brake&&!gas,wheelContacts);   // skid marks exactly under the tires, in real time

  for(const w of wheelObjects){
   if(w.userData.baseRotationX===undefined)w.userData.baseRotationX=w.rotation.x;
   w.rotation.x+=speed*dt/Math.max(.25,wheelRadius)*TIREMARKS.spinK;
  }

  if(mapBox && (
   vehicle.position.x<mapBox.min.x-20||vehicle.position.x>mapBox.max.x+20||
   vehicle.position.z<mapBox.min.z-20||vehicle.position.z>mapBox.max.z+20||
   vehicle.position.y<mapBox.min.y-30
  ))resetVehicle();

  SMOKE.update(dt,gas,brake);
  updateWeather(dt);
  CAR_AUDIO.update(dt,gas,1,brake);
  FIRE.update(dt);

  // Chase camera (+ free orbit while stopped; returns behind the car once moving)
  if(!canOrbit()){
   orbit.dragging=false;
   orbit.yaw=Math.atan2(Math.sin(orbit.yaw),Math.cos(orbit.yaw));
   orbit.yaw=THREE.MathUtils.damp(orbit.yaw,0,4.5,dt);
   orbit.pitch=THREE.MathUtils.damp(orbit.pitch,0,4.5,dt);
   if(Math.abs(orbit.yaw)<.002)orbit.yaw=0;
   if(Math.abs(orbit.pitch)<.002)orbit.pitch=0;
  }
  const orbitAmt=Math.min(1,Math.abs(orbit.yaw)*2+Math.abs(orbit.pitch)*3);
  const forwardCamera=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
  const pitchA=THREE.MathUtils.clamp(0.425+orbit.pitch,0.06,1.25);
  const camAng=heading+Math.PI+orbit.yaw;
  const camHoriz=7.03*Math.cos(pitchA),camVert=7.03*Math.sin(pitchA);
  const desiredCamera=new THREE.Vector3(
   vehicle.position.x+Math.sin(camAng)*camHoriz,
   vehicle.position.y+camVert,
   vehicle.position.z+Math.cos(camAng)*camHoriz
  );
  if(orbitAmt>0){
   const gh=groundHit(desiredCamera.x,desiredCamera.z,vehicle.position.y+40,90);
   if(gh&&desiredCamera.y<gh.point.y+0.6)desiredCamera.y=gh.point.y+0.6;
  }
  const lookAhead=1.8*(1-orbitAmt)+Math.min(Math.abs(speed)*0.035,2.0);
  const cameraTarget=vehicle.position.clone()
    .add(new THREE.Vector3(0,1.05,0))
    .addScaledVector(forwardCamera,lookAhead);
  camera.position.lerp(desiredCamera,1-Math.exp(-16*dt));
  cameraLook.lerp(cameraTarget,1-Math.exp(-18*dt));
  camera.lookAt(cameraLook);

  // Stable shadow: fixed light direction + texel-snapped focus (no glitch)
  updateShadowFocus(dt);

  document.querySelector('#speed').innerHTML=Math.round(Math.abs(speed)*3.6)+'<small>KM/H</small>';
 }

 if(composer){
  composer.render();
 }else{
  renderer.render(scene,camera);
 }
}
requestAnimationFrame(animate);

function resizeGame(){
 const w=Math.max(1,host.clientWidth||document.documentElement.clientWidth||innerWidth);
 const h=Math.max(1,host.clientHeight||document.documentElement.clientHeight||innerHeight);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
 renderer.setSize(w,h,false);
 if(composer){
  composer.setSize(w,h);
  [composer.renderTarget1,composer.renderTarget2].forEach(rt=>{
   const dtex=rt.depthTexture;
   if(dtex&&(dtex.image.width!==rt.width||dtex.image.height!==rt.height)){
    dtex.image.width=rt.width;dtex.image.height=rt.height;dtex.needsUpdate=true;
   }
  });
  if(bloomPass)bloomPass.resolution.set(w,h);
 }
}
resizeGame();
addEventListener('resize',resizeGame,{passive:true});
addEventListener('orientationchange',()=>setTimeout(resizeGame,180),{passive:true});
if(window.visualViewport){
 visualViewport.addEventListener('resize',resizeGame,{passive:true});
 visualViewport.addEventListener('scroll',resizeGame,{passive:true});
}
if('ResizeObserver' in window){
 const viewportObserver=new ResizeObserver(resizeGame);
 viewportObserver.observe(host);
}
</script>
